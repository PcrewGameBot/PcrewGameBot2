<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PCREW Escape Room</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --danger-color: #f85149;
            --success-color: #2ea043;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        header {
            padding: 12px 16px;
            background: #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: bold;
        }
        .header-btns button {
            background: #30363d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
        }
        .header-btns button:active { background: var(--accent-color); color: #fff; }
        
        #room-view {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #222b38 0%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            text-align: center;
        }
        .room-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-color);
            margin-top: 10px;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .room-desc {
            font-size: 13px;
            margin-bottom: 20px;
            color: #8b949e;
            max-width: 90%;
        }
        
        .interactive-area {
            width: 100%;
            height: 320px;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            position: relative;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .hotspot {
            position: absolute;
            padding: 12px 16px;
            background: rgba(88, 166, 255, 0.15);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .hotspot:active { background: var(--accent-color); color: #fff; transform: scale(0.95); }

        #inventory-bar {
            height: 75px;
            background: #111418;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 12px;
            overflow-x: auto;
        }
        .inv-slot {
            width: 55px;
            height: 55px;
            background: #21262d;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        .inv-slot.selected { border-color: var(--accent-color); background: rgba(88,166,255,0.2); }

        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-content h3 { margin-bottom: 12px; color: var(--accent-color); font-size: 18px; }
        .modal-content p { font-size: 13px; margin-bottom: 16px; color: #8b949e; line-height: 1.4; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }
        .modal-content input:focus { border-color: var(--accent-color); }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn {
            background: var(--success-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-close { background: #30363d; }

        #message-box {
            position: absolute;
            bottom: 90px;
            background: rgba(33, 38, 45, 0.95);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <div><span id="lbl-room">Room: 1 / 3</span> | ⏱️ <span id="lbl-timer">00:00</span></div>
            <div class="header-btns">
                <button onclick="showHint()">💡 Hint</button>
                <button onclick="restartGame()">🔄 Reset</button>
            </div>
        </header>

        <div id="room-view">
            <div class="room-title" id="room-title">THE STUDY</div>
            <div class="room-desc" id="room-desc">Find a way to unlock the heavy exit door.</div>
            
            <div class="interactive-area" id="interactive-area"></div>
        </div>

        <div id="message-box">Message</div>

        <div id="inventory-bar"></div>
    </div>

    <!-- Puzzle Modal -->
    <div class="modal" id="puzzle-modal">
        <div class="modal-content">
            <h3 id="modal-title">Puzzle</h3>
            <p id="modal-desc">Solve this puzzle to proceed.</p>
            <div id="modal-body">
                <input type="text" id="puzzle-input" placeholder="Enter answer">
            </div>
            <div class="btn-group">
                <button class="btn" onclick="submitPuzzle()">Submit</button>
                <button class="btn btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal" id="victory-modal">
        <div class="modal-content">
            <h3 style="color: var(--success-color);">🎉 ESCAPE SUCCESSFUL!</h3>
            <p id="victory-stats">You escaped all rooms!</p>
            <button class="btn" onclick="returnToHub()">Back to Hub</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let currentRoom = 1;
        let inventory = [];
        let selectedItem = null;
        let gameTime = 0;
        let timerInterval = null;
        let hintsUsed = 0;

        let roomState = {
            1: { drawerUnlocked: false, keyCollected: false },
            2: { circuitFixed: false, labDoorUnlocked: false },
            3: { safeUnlocked: false, crystalPlaced: false, finalEscaped: false }
        };

        const hints = {
            1: [
                "Inspect the painting for a secret sequence.",
                "The code for the desk is 4-2-7.",
                "Take the key from the desk to unlock the door."
            ],
            2: [
                "Interact with the control panel.",
                "Wire sequence code is 1234.",
                "The security door password is LABORATORY."
            ],
            3: [
                "Unlock the vault safe using code 9876.",
                "Pick up the Energy Crystal.",
                "Place the crystal to open the final exit portal!"
            ]
        };

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                gameTime++;
                let mins = String(Math.floor(gameTime / 60)).padStart(2, '0');
                let secs = String(gameTime % 60).padStart(2, '0');
                document.getElementById('lbl-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function showMessage(text) {
            let box = document.getElementById('message-box');
            box.innerText = text;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 2200);
        }

        function renderRoom() {
            document.getElementById('lbl-room').innerText = `Room: ${currentRoom} / 3`;
            let area = document.getElementById('interactive-area');
            area.innerHTML = '';

            if (currentRoom === 1) {
                document.getElementById('room-title').innerText = "ROOM 1: THE STUDY";
                document.getElementById('room-desc').innerText = "A mysterious study room. Find the key to unlock the exit door.";

                let painting = document.createElement('div');
                painting.className = 'hotspot';
                painting.style.top = '15%'; painting.style.left = '35%';
                painting.innerText = '🖼️ Painting';
                painting.onclick = () => showMessage('Behind the painting, numbers are carved: 4 - 2 - 7');
                area.appendChild(painting);

                if (!roomState[1].drawerUnlocked) {
                    let desk = document.createElement('div');
                    desk.className = 'hotspot';
                    desk.style.top = '45%'; desk.style.left = '15%';
                    desk.innerText = '🗄️ Locked Desk';
                    desk.onclick = () => openPuzzle(1, 'Locked Desk', 'Enter 3-digit code from the painting:', '427');
                    area.appendChild(desk);
                } else if (!roomState[1].keyCollected) {
                    let key = document.createElement('div');
                    key.className = 'hotspot';
                    key.style.top = '50%'; key.style.left = '20%';
                    key.innerText = '🔑 Brass Key';
                    key.onclick = () => collectItem('Brass Key', '🔑');
                    area.appendChild(key);
                }

                let door = document.createElement('div');
                door.className = 'hotspot';
                door.style.top = '40%'; door.style.right = '15%';
                door.innerText = '🚪 Exit Door';
                door.onclick = () => {
                    if (inventory.includes('Brass Key')) {
                        advanceRoom(2);
                    } else {
                        showMessage('The door is locked! Find the key first.');
                    }
                };
                area.appendChild(door);

            } else if (currentRoom === 2) {
                document.getElementById('room-title').innerText = "ROOM 2: THE LABORATORY";
                document.getElementById('room-desc').innerText = "Power is offline. Repair the circuit and override the security door.";

                if (!roomState[2].circuitFixed) {
                    let panel = document.createElement('div');
                    panel.className = 'hotspot';
                    panel.style.top = '35%'; panel.style.left = '20%';
                    panel.innerText = '⚡ Control Panel';
                    panel.onclick = () => openPuzzle(2, 'Circuit Box', 'Enter circuit connection code (1234):', '1234');
                    area.appendChild(panel);
                } else {
                    let secDoor = document.createElement('div');
                    secDoor.className = 'hotspot';
                    secDoor.style.top = '40%'; secDoor.style.right = '20%';
                    secDoor.innerText = '🔐 Security Door';
                    secDoor.onclick = () => openPuzzle(2, 'Security Terminal', 'Enter override password:', 'LABORATORY');
                    area.appendChild(secDoor);
                }

            } else if (currentRoom === 3) {
                document.getElementById('room-title').innerText = "ROOM 3: THE VAULT";
                document.getElementById('room-desc').innerText = "The final vault. Retrieve the Energy Crystal to unlock the portal.";

                if (!roomState[3].safeUnlocked) {
                    let safe = document.createElement('div');
                    safe.className = 'hotspot';
                    safe.style.top = '40%'; safe.style.left = '20%';
                    safe.innerText = '🛅 Vault Safe';
                    safe.onclick = () => openPuzzle(3, 'Vault Safe', 'Enter 4-digit passcode (9876):', '9876');
                    area.appendChild(safe);
                } else if (!roomState[3].crystalPlaced) {
                    let crystal = document.createElement('div');
                    crystal.className = 'hotspot';
                    crystal.style.top = '45%'; crystal.style.left = '25%';
                    crystal.innerText = '💎 Energy Crystal';
                    crystal.onclick = () => collectItem('Crystal', '💎');
                    area.appendChild(crystal);
                } else {
                    let portal = document.createElement('div');
                    portal.className = 'hotspot';
                    portal.style.top = '35%'; portal.style.left = '30%';
                    portal.innerText = '🌟 Active Portal';
                    portal.onclick = () => triggerVictory();
                    area.appendChild(portal);
                }
            }
            renderInventory();
        }

        function collectItem(name, icon) {
            if (!inventory.includes(name)) {
                inventory.push(name);
                showMessage(`Collected: ${name}`);
                if (currentRoom === 1 && name === 'Brass Key') roomState[1].keyCollected = true;
                if (currentRoom === 3 && name === 'Crystal') roomState[3].crystalPlaced = true;
                renderRoom();
            }
        }

        function renderInventory() {
            let bar = document.getElementById('inventory-bar');
            bar.innerHTML = '';
            inventory.forEach(item => {
                let slot = document.createElement('div');
                slot.className = `inv-slot ${selectedItem === item ? 'selected' : ''}`;
                slot.innerText = item === 'Brass Key' ? '🔑' : '💎';
                slot.onclick = () => {
                    selectedItem = item;
                    showMessage(`Selected: ${item}`);
                    renderInventory();
                };
                bar.appendChild(slot);
            });
        }

        let activePuzzleRoom = 1;
        let expectedAnswer = '';

        function openPuzzle(room, title, desc, answer) {
            activePuzzleRoom = room;
            expectedAnswer = answer;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('puzzle-input').value = '';
            document.getElementById('puzzle-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('puzzle-modal').style.display = 'none';
        }

        function submitPuzzle() {
            let val = document.getElementById('puzzle-input').value.trim();
            if (val.toUpperCase() === expectedAnswer.toUpperCase()) {
                closeModal();
                showMessage('Correct! Puzzle Solved.');
                if (currentRoom === 1) {
                    roomState[1].drawerUnlocked = true;
                } else if (currentRoom === 2) {
                    if (expectedAnswer === '1234') {
                        roomState[2].circuitFixed = true;
                    } else {
                        roomState[2].labDoorUnlocked = true;
                        advanceRoom(3);
                        return;
                    }
                } else if (currentRoom === 3) {
                    roomState[3].safeUnlocked = true;
                }
                renderRoom();
            } else {
                showMessage('Incorrect code! Try again.');
            }
        }

        function advanceRoom(room) {
            currentRoom = room;
            showMessage(`Advanced to Room ${room}!`);
            renderRoom();
        }

        function showHint() {
            let hintList = hints[currentRoom];
            let text = hintList[hintsUsed % hintList.length];
            hintsUsed++;
            alert(`💡 HINT: ${text}`);
        }

        function triggerVictory() {
            clearInterval(timerInterval);
            let timeStr = document.getElementById('lbl-timer').innerText;
            document.getElementById('victory-stats').innerText = `Escaped in ${timeStr} with ${hintsUsed} hints used!`;
            document.getElementById('victory-modal').style.display = 'flex';
            
            if (tg && tg.sendData) {
                try {
                    tg.sendData(JSON.stringify({ game: 'escaperoom', time: gameTime, hints: hintsUsed, score: 100 }));
                } catch(e) {}
            }
        }

        function returnToHub() {
            window.location.href = 'hub.html';
        }

        function restartGame() {
            currentRoom = 1;
            inventory = [];
            selectedItem = null;
            gameTime = 0;
            hintsUsed = 0;
            roomState = {
                1: { drawerUnlocked: false, keyCollected: false },
                2: { circuitFixed: false, labDoorUnlocked: false },
                3: { safeUnlocked: false, crystalPlaced: false, finalEscaped: false }
            };
            startTimer();
            renderRoom();
        }

        window.onload = () => {
            startTimer();
            renderRoom();
        };
    </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Crowd Cannon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#10151f;--ink:#f4f7ff;--dim:#a3b0c9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px;box-sizing:border-box}
#hud{display:flex;align-items:center;gap:8px;border:1px solid #3a4a6b;border-radius:14px;padding:6px 10px;background:#161d2c}
.st{flex:1;text-align:center;font-size:10px;color:var(--dim);font-weight:700}.st b{display:block;font-size:17px;color:var(--ink);font-weight:900}
.ib{width:34px;height:34px;font-size:14px;padding:0}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}#c{width:100%;height:100%;display:block;border-radius:16px;border:1px solid #3a4a6b;touch-action:none}
#ov{position:absolute;inset:0;border-radius:16px;background:rgba(10,14,24,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;line-height:1.6}
#ov h1{margin:0;font-size:32px;font-weight:900;color:#ffd84d;text-shadow:0 3px 0 #8a5a00,0 0 18px #000a}
#ov p{margin:0;font-size:13px;color:var(--dim)}#ov .big{font-size:42px;font-weight:900}
.go{padding:13px 40px;font-size:17px;margin-top:6px}
/* Glossy gradient pill buttons */
.go,.ib{isolation:isolate;position:relative;border:2px solid #8f9bff;border-radius:999px;color:#fff;font-weight:900;background:linear-gradient(180deg,#5b78ff 0%,#2c35e6 52%,#1b20b9 100%);box-shadow:0 0 0 1px #0a0f5a,0 4px 14px #2c35e688,inset 0 -3px 7px #0a0e7a99}
.go::before,.ib::before{content:"";position:absolute;z-index:-1;left:9%;right:9%;top:3px;height:44%;border-radius:999px;background:linear-gradient(180deg,#ffffffb3,#ffffff14);pointer-events:none}
.go:active,.ib:active{transform:translateY(1px) scale(.97);filter:brightness(.92)}
</style></head><body><div id="app">
<div id="hud"><div class="st">WAVE<b id="hl">1</b></div><div class="st">SCORE<b id="hs">0</b></div><div class="st">ARMY<b id="ha">0</b></div><button class="ib" id="bp">⏸</button><button class="ib" id="bm">🔊</button></div>
<div id="stage"><div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),W=360,H=640,BASE=525,CY=592,GA=430,GB=292,GW=128;C.width=W;C.height=H;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const GAME='crowdcannon';
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}tg.BackButton.show();tg.BackButton.onClick(()=>{location.href='/'})}
fetch('/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:''})}).then(r=>r.json()).then(m=>{if(!m.ok||!m.joined)location.href='/'}).catch(()=>{});
const esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
async function loadLb(){try{const r=await (await fetch('/api/leaderboard?game='+GAME)).json(),e=$('lb');if(e)e.innerHTML=r.slice(0,5).map((x,i)=>(i+1)+'. '+esc(x.name)+' - '+x.score).join('<br>')}catch(e){}}
async function submit(){try{await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:GAME,score:Math.floor(score),initData:tg?tg.initData:''})})}catch(e){}loadLb()}
let best=0;try{best=+localStorage.getItem('cc_best')||0}catch(e){}
let mode='menu',paused=false,muted=false,T=0,score=0,wave=0,delay=.8,cx=180,tx=180,fire=0,shake=0,flash=0,popT=0,recoil=0,danger=0;
let sol=[],en=[],fx=[],gates=[],pops=[];
const K={l:0,r:0};
const rocks=[];for(let s=0;s<2;s++)for(let i=0;i<26;i++)rocks.push({x:s?342+R(0,12):R(-6,12),y:i*26+R(-6,6),w:R(14,26),h:R(16,28),c:Math.floor(R(60,95))});
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty='sine',v=.06,sl=0,delay=0){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+delay;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d)}
function mkGate(y,bit,s,good){let t,v;if(good){const pool=y===GB?['x2','x2','x3']:['x2','x2','x3','x3','x4'];const p=pool[Math.floor(R(0,pool.length))];t=p[0];v=+p.slice(1)}else{t='/';v=Math.random()<.75?2:3}
 return{y,bit,base:180+s*(GW/2+14),t,v,good,ph:R(0,6.28),fl:0,born:T}}
function makeGates(){gates=[];const pb=Math.min(.5,.08+wave*.045);for(const[y,bit]of[[GA,1],[GB,2]]){let a=Math.random()>pb,b=Math.random()>pb;if(!a&&!b){if(Math.random()<.5)a=true;else b=true}gates.push(mkGate(y,bit,-1,a),mkGate(y,bit,1,b))}}
const gx=g=>g.base+Math.min(14,Math.max(0,wave-2)*3)*Math.sin(T*1.2+g.ph);
const glabel=g=>(g.t==='x'?'×':g.t==='+'?'+':'÷')+g.v;
function blob(x,n){const dots=Array.from({length:170},()=>({a:R(0,6.28),u:Math.sqrt(R(0,1)),p:R(0,6.28)}));return{x,y:-50,n,mx:n,dots,sp:24+wave*2}}
const br=e=>Math.min(72,12+Math.sqrt(e.n)*1.9);
function spawnWave(){const n=60+wave*55;if(wave>=5){en.push(blob(110,Math.floor(n*.6)),blob(250,Math.floor(n*.4)))}else en.push(blob(R(120,240),n))}
function reset(){T=0;score=0;wave=0;delay=.8;cx=180;tx=180;fire=0;shake=0;flash=0;danger=0;sol=[];en=[];fx=[];pops=[];makeGates()}
const pop=(x,y,s,c)=>pops.push({x,y,s,c,l:1});
function spark(x,y,n,c){for(let i=0;i<n&&fx.length<260;i++){const a=R(0,6.28),v=R(30,200);fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.25,.6),c})}}
function spawnS(x,y,vx,p){if(sol.length<900)sol.push({x,y,vx,vy:-340,p,py:y})}
function over(){mode='over';if(score>best){best=score;try{localStorage.setItem('cc_best',Math.floor(score))}catch(e){}}submit();show('over')}
function update(dt){T+=dt;
 const kx=K.r-K.l;if(kx)tx=clamp(tx+kx*320*dt,30,330);cx+=(tx-cx)*Math.min(1,dt*14);recoil=Math.max(0,recoil-dt*40);
 const rate=Math.min(16,8+wave*.7);fire-=dt;while(fire<=0){spawnS(cx+R(-4,4),CY-40,R(-14,14),0);fire+=1/rate;recoil=4}
 for(const g of gates)g.fl=Math.max(0,g.fl-dt);
 if(en.length===0){delay-=dt;if(delay<=0){wave++;makeGates();spawnWave();pop(W/2,200,'WAVE '+wave,'#ffd84d');tone(440,.25,'triangle',.06,300);if(wave>1){const b=wave*20;score+=b}}}
 const gl=gates.map(g=>[g,gx(g)]);
 for(const s of sol){s.py=s.y;
  let t=null,bd=1e9;for(const e of en){if(e.y<s.y){const d=Math.abs(e.x-s.x)+Math.abs(e.y-s.y)*.3;if(d<bd){bd=d;t=e}}}
  if(t&&(s.y<GB-10||t.y>GA-20)){const dx=t.x-s.x,dy=t.y-s.y,l=Math.hypot(dx,dy)||1,k=Math.min(1,dt*7);s.vx+=(dx/l*340-s.vx)*k;s.vy+=(dy/l*340-s.vy)*k}
  s.y+=s.vy*dt;s.x=clamp(s.x+s.vx*dt,22,338);
  for(const[g,c]of gl){if(s.py>g.y&&s.y<=g.y&&!(s.p&g.bit)&&Math.abs(s.x-c)<GW/2){s.p|=g.bit;g.fl=.18;
   if(g.t==='x'){for(let i=1;i<g.v;i++)spawnS(s.x+R(-7,7),s.y+R(0,10),s.vx+R(-35,35),s.p)}
   else if(g.t==='+'){for(let i=0;i<g.v;i++)spawnS(s.x+R(-8,8),s.y+R(0,12),s.vx+R(-35,35),s.p)}
   else if(Math.random()<1-1/g.v){s.dead=1}
   if(T-popT>.09){popT=T;tone(g.good?620+Math.random()*200:180,.07,'triangle',.04)}}}
  if(s.y<-10)s.dead=1;
  if(!s.dead)for(const e of en){const dx=s.x-e.x,dy=s.y-e.y,r=br(e)+2;if(dx*dx+dy*dy<r*r){s.dead=1;e.n--;score++;if(Math.random()<.3)spark(s.x,s.y,1,'#ff8a8a');break}}}
 sol=sol.filter(s=>!s.dead);
 danger=0;
 for(const e of en){e.y+=e.sp*dt;e.hit=0;const r=br(e);if(e.n<=0){e.dead=1;spark(e.x,e.y,36,'#ff6b6b');shake=8;tone(110,.3,'sawtooth',.08,-50)}
  else if(e.y+r>=BASE){mode='dead';shake=16;flash=.5;tone(180,.6,'sawtooth',.1,-140);setTimeout(over,700)}
  else danger=Math.max(danger,1-(BASE-e.y-r)/110)}
 if(en.length&&en.every(e=>e.dead)){delay=1.1}
 en=en.filter(e=>!e.dead);if(!en.length&&mode==='play'&&delay<=0)delay=1.1;
 }
function ambient(dt){for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}fx=fx.filter(f=>f.l>0);for(const p of pops){p.y-=26*dt;p.l-=dt*1.1}pops=pops.filter(p=>p.l>0);shake*=.88;flash=Math.max(0,flash-dt*2.5)}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function cannon(x,y){X.save();X.translate(x,y);X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(2,22,30,10,0,0,6.28);X.fill();
 X.fillStyle='#2b190b';rr(-27,-6,10,26,3);X.fill();rr(17,-6,10,26,3);X.fill();X.fillStyle='#5a3a1c';rr(-25,-4,4,22,2);X.fill();rr(19,-4,4,22,2);X.fill();
 let g=X.createLinearGradient(-18,0,18,0);g.addColorStop(0,'#7a4a22');g.addColorStop(.5,'#c98a4a');g.addColorStop(1,'#7a4a22');X.fillStyle=g;X.strokeStyle='#4a2c14';X.lineWidth=2;rr(-18,-14,36,38,7);X.fill();X.stroke();
 g=X.createLinearGradient(-9,0,9,0);g.addColorStop(0,'#1f2530');g.addColorStop(.45,'#77808f');g.addColorStop(1,'#1f2530');X.fillStyle=g;rr(-9,-46+recoil,18,46,5);X.fill();X.strokeStyle='#0b0f16';X.stroke();
 X.fillStyle='#10151d';rr(-11,-50+recoil,22,9,3);X.fill();X.fillStyle='#3b82f6';X.shadowColor='#60a5fa';X.shadowBlur=10;X.beginPath();X.arc(0,6,6,0,6.28);X.fill();X.shadowBlur=0;
 if(recoil>1){X.fillStyle='rgba(255,220,120,.85)';X.beginPath();X.arc(0,-56,7+recoil,0,6.28);X.fill()}
 X.restore()}
function gate(g){const c=gx(g),w=GW,h=34,x=c-w/2,y=g.y-h/2,k=Math.min(1,(T-g.born)*4);if(k<=0)return;
 X.save();X.translate(c,g.y);X.scale(1,k);X.translate(-c,-g.y);
 X.fillStyle='rgba(0,0,0,.25)';rr(x+3,y+5,w,h,8);X.fill();
 const gr=X.createLinearGradient(0,y,0,y+h);if(g.good){gr.addColorStop(0,'#fde047');gr.addColorStop(1,'#d89a00')}else{gr.addColorStop(0,'#ff6b6b');gr.addColorStop(1,'#a51d1d')}
 X.fillStyle=gr;X.strokeStyle=g.good?'#8a5a00':'#5c0f0f';X.lineWidth=3;rr(x,y,w,h,8);X.fill();X.stroke();
 X.fillStyle='rgba(255,255,255,'+(.3+g.fl*3)+')';rr(x+6,y+3,w-12,h*.34,6);X.fill();
 X.fillStyle=g.good?'#fde047':'#ff6b6b';X.fillRect(x-4,y-6,6,h+12);X.fillRect(x+w-2,y-6,6,h+12);
 X.textAlign='center';X.textBaseline='middle';X.font='900 26px Impact,system-ui,sans-serif';X.lineWidth=5;X.strokeStyle=g.good?'#6b4300':'#4a0c0c';X.strokeText(glabel(g),c,g.y+1);X.fillStyle='#fff';X.fillText(glabel(g),c,g.y+1);
 X.restore()}
function crowd(e){const r=br(e),dn=Math.min(170,Math.ceil(e.n*.8)+6);X.fillStyle='rgba(120,0,0,.25)';X.beginPath();X.arc(e.x,e.y+4,r+4,0,6.28);X.fill();
 X.fillStyle='#7f1d1d';for(let i=0;i<dn;i++){const d=e.dots[i],a=d.a,rad=d.u*(r-3);X.beginPath();X.arc(e.x+Math.cos(a)*rad+Math.sin(T*5+d.p)*1.2,e.y+Math.sin(a)*rad,4.4,0,6.28);X.fill()}
 X.fillStyle='#ef4444';for(let i=0;i<dn;i++){const d=e.dots[i],a=d.a,rad=d.u*(r-3);X.beginPath();X.arc(e.x+Math.cos(a)*rad+Math.sin(T*5+d.p)*1.2,e.y+Math.sin(a)*rad-.8,3.4,0,6.28);X.fill()}
 X.textAlign='center';X.textBaseline='middle';X.font='900 24px Impact,system-ui,sans-serif';X.lineWidth=6;X.strokeStyle='rgba(60,0,0,.85)';X.strokeText(e.n,e.x,e.y-r-12);X.fillStyle='#fff';X.fillText(e.n,e.x,e.y-r-12)}
function draw(){
 X.save();if(shake>.3)X.translate(R(-shake,shake),R(-shake,shake));
 X.fillStyle='#2a3447';X.fillRect(-20,-20,W+40,H+40);
 for(const k of rocks){X.fillStyle='rgb('+k.c+','+(k.c+8)+','+(k.c+22)+')';X.fillRect(k.x,k.y,k.w,k.h);X.fillStyle='rgba(255,255,255,.07)';X.fillRect(k.x,k.y,k.w,3)}
 let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cfae7c');g.addColorStop(1,'#e0c08e');X.fillStyle=g;X.fillRect(18,0,324,H);
 X.fillStyle='rgba(255,255,255,.07)';const sc=(T*40)%60;for(let y=-60+sc;y<H;y+=60)X.fillRect(18,y,324,12);
 X.fillStyle='#6aa84f';X.fillRect(14,0,5,H);X.fillRect(341,0,5,H);X.fillStyle='#7d8aa0';X.fillRect(10,0,4,H);X.fillRect(346,0,4,H);
 X.fillStyle='rgba(120,20,20,'+(.12+danger*.25)+')';X.fillRect(18,0,324,70);
 X.setLineDash([10,8]);X.strokeStyle='rgba(220,40,40,'+(.45+danger*.55)+')';X.lineWidth=3;X.beginPath();X.moveTo(18,BASE);X.lineTo(342,BASE);X.stroke();X.setLineDash([]);
 for(const gt of gates)gate(gt);
 X.fillStyle='#10286b';for(const s of sol)X.fillRect(s.x-2.4,s.y-2.4,4.8,4.8);
 X.fillStyle='#4f93ff';for(const s of sol)X.fillRect(s.x-1.6,s.y-2,3.2,3.2);
 for(const e of en)crowd(e);
 if(mode!=='dead'||T%.2<.1)cannon(cx,CY);
 for(const f of fx){X.globalAlpha=Math.min(1,f.l*3);X.fillStyle=f.c;X.fillRect(f.x,f.y,3,3)}X.globalAlpha=1;
 X.textAlign='center';X.textBaseline='alphabetic';X.font='900 18px system-ui,sans-serif';for(const p of pops){X.globalAlpha=Math.min(1,p.l*1.5);X.lineWidth=4;X.strokeStyle='rgba(0,0,0,.55)';X.strokeText(p.s,p.x,p.y);X.fillStyle=p.c;X.fillText(p.s,p.x,p.y)}X.globalAlpha=1;
 if(flash>0){X.fillStyle='rgba(255,60,60,'+flash*.6+')';X.fillRect(-20,-20,W+40,H+40)}
 X.restore()}
let hc='';function hud(){const h=wave+'|'+Math.floor(score)+'|'+sol.length;if(h===hc)return;hc=h;$('hl').textContent=Math.max(1,wave);$('hs').textContent=Math.floor(score);$('ha').textContent=sol.length}
function show(k){const o=$('ov');o.style.display='flex';
 if(k=='menu')o.innerHTML='<h1>CROWD<br>CANNON</h1><p>Drag to move the cannon.<br>Shoot soldiers through the gold gates to multiply them.<br>Avoid red gates. Stop the red crowd before it reaches your base!</p><p>BEST '+best+'</p><p id="lb" style="font-size:12px"></p><button class="go" id="go">PLAY</button>';
 else if(k=='over')o.innerHTML='<p>BASE OVERRUN</p><div class="big">'+Math.floor(score)+'</div><p>WAVE '+wave+' · BEST '+best+'</p><p id="lb" style="font-size:12px"></p><button class="go" id="go">RETRY</button>';
 else o.innerHTML='<h1>PAUSED</h1><button class="go" id="go">RESUME</button>';
 if(k!='pause')loadLb();
 $('go').onclick=()=>{ac();if(k=='pause')togglePause();else{reset();mode='play';hc='';o.style.display='none'}}}
function togglePause(){if(mode!=='play')return;paused=!paused;if(paused)show('pause');else $('ov').style.display='none'}
let down=false;
function setX(e){const r=C.getBoundingClientRect();tx=clamp((e.clientX-r.left)/r.width*W,30,330)}
C.addEventListener('pointerdown',e=>{e.preventDefault();ac();down=true;setX(e);try{C.setPointerCapture(e.pointerId)}catch(x){}});
C.addEventListener('pointermove',e=>{if(down)setX(e)});
['pointerup','pointercancel'].forEach(t=>C.addEventListener(t,()=>{down=false}));
$('bp').onclick=togglePause;$('bm').onclick=()=>{muted=!muted;$('bm').textContent=muted?'🔇':'🔊'};
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a'||k=='A'){e.preventDefault();K.l=1}else if(k=='ArrowRight'||k=='d'||k=='D'){e.preventDefault();K.r=1}else if(k=='p'||k=='P'||k=='Escape')togglePause()});
addEventListener('keyup',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a'||k=='A')K.l=0;else if(k=='ArrowRight'||k=='d'||k=='D')K.r=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused)togglePause()});
addEventListener('contextmenu',e=>e.preventDefault());
function fit(){const s=$('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H),e=$('wrap');e.style.width=W*k+'px';e.style.height=H*k+'px'}
addEventListener('resize',fit);fit();reset();show('menu');
let last=performance.now();(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(!paused){ambient(dt);if(mode==='play')update(dt);else if(mode==='menu'||mode==='dead')T+=dt}draw();hud();requestAnimationFrame(loop)})(last);
</script></body></html>

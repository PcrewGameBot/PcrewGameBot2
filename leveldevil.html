<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Level Devil</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--ink:#f4f7ff;--dim:#b4bfd8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0e1420;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px;box-sizing:border-box}
#hud{display:flex;align-items:center;gap:8px;border:1px solid #3a4a6b;border-radius:14px;padding:6px 10px;background:#161d2c}
.st{flex:1;text-align:center;font-size:10px;color:var(--dim);font-weight:700}.st b{display:block;font-size:17px;color:var(--ink);font-weight:900;white-space:nowrap}
.ib{width:34px;height:34px;font-size:14px;padding:0}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}#c{width:100%;height:100%;display:block;border-radius:16px;border:1px solid #3a4a6b;touch-action:none}
#ov{position:absolute;inset:0;border-radius:16px;background:rgba(6,8,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;line-height:1.6}
#ov h1{margin:0;font-size:32px;font-weight:900;color:#ff6b4a;text-shadow:0 3px 0 #0007,0 0 18px #000a}
#ov p{margin:0;font-size:13px;color:var(--dim)}#ov .big{font-size:44px;font-weight:900}
.go{padding:13px 40px;font-size:17px}
.go,.ib{isolation:isolate;position:relative;border:2px solid #8f9bff;border-radius:999px;color:#fff;font-weight:900;background:linear-gradient(180deg,#5b78ff 0%,#2c35e6 52%,#1b20b9 100%);box-shadow:0 0 0 1px #0a0f5a,0 4px 14px #2c35e688,inset 0 -3px 7px #0a0e7a99}
.go::before,.ib::before{content:"";position:absolute;z-index:-1;left:9%;right:9%;top:3px;height:44%;border-radius:999px;background:linear-gradient(180deg,#ffffffb3,#ffffff14);pointer-events:none}
.go:active,.ib:active{transform:translateY(1px) scale(.97);filter:brightness(.92)}
.go.rk{background:linear-gradient(180deg,#c084fc 0%,#7e22ce 52%,#581c87 100%);border-color:#e9d5ff;padding:10px 30px;font-size:14px}
#rkm{position:fixed;inset:0;background:rgba(5,3,20,.78);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.rkc{width:min(100%,360px);max-height:80%;overflow:auto;background:linear-gradient(180deg,#2a1670,#0f0a3a);border:1px solid #ffffff2e;border-radius:26px;padding:18px;box-shadow:0 20px 50px #000a;text-align:center;color:#fff;font-family:system-ui,sans-serif}
.rkc h2{margin:0 0 12px;font-size:24px;font-weight:900}
.rkl{text-align:left;margin-bottom:14px;color:#cfc9f7;font-size:14px}
.rkr{display:flex;gap:10px;align-items:center;background:#ffffff14;border-radius:14px;padding:10px 12px;margin-bottom:8px;color:#fff}
.rkr span:first-child{width:30px;text-align:center;font-weight:900}.rkr span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.rkr span:last-child{font-weight:900;color:#ffd84d}
.rkr.me{outline:2px solid #a78bfa;background:#a78bfa33}

#ctl{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px}
.dp{display:flex;gap:12px}
.cb{isolation:isolate;position:relative;width:62px;height:62px;border-radius:50%;border:2px solid #8f9bff;color:#fff;font-size:24px;font-weight:900;background:linear-gradient(180deg,#5b78ff 0%,#2c35e6 52%,#1b20b9 100%);box-shadow:0 0 0 1px #0a0f5a,0 4px 14px #2c35e688,inset 0 -3px 7px #0a0e7a99;padding:0;touch-action:none}
.cb::before{content:"";position:absolute;z-index:-1;left:14%;right:14%;top:3px;height:42%;border-radius:999px;background:linear-gradient(180deg,#ffffffb3,#ffffff14);pointer-events:none}
.cb:active{transform:translateY(1px) scale(.96);filter:brightness(.92)}
.cb.jb{width:72px;height:72px;font-size:26px;background:linear-gradient(180deg,#ffb347 0%,#f0701b 52%,#b8400a 100%);border-color:#ffe0b3;box-shadow:0 0 0 1px #5a2305,0 4px 14px #f0701b88,inset 0 -3px 7px #7a2d0599}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px}
.mp{position:relative;border:2px solid #ffffff88;border-radius:18px;padding:10px 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 12px #0007,inset 0 2px 0 #ffffff66}
.mp span{font-size:28px}.mp b{font-size:14px;text-shadow:0 1px 3px #000a}.mp small{font-size:12px;font-weight:700;background:#0006;border-radius:999px;padding:1px 10px}
.mp:active{transform:scale(.96)}
</style></head><body><div id="app">
<div id="hud"><div class="st">LEVEL<b id="hl">0</b></div><div class="st">CLEARED<b id="hs">0</b></div><div class="st">DEATHS<b id="ha">0</b></div><button class="ib" id="bp">⏸</button><button class="ib" id="bm">🔊</button></div>
<div id="stage"><div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div></div>
<div id="ctl"><div class="dp"><button class="cb" id="bl">◀</button><button class="cb" id="br">▶</button></div><button class="cb jb" id="bj">▲</button></div>
</div>
<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),W=360,H=640;C.width=W;C.height=H;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const GAME='leveldevil',MENU_T='LEVEL<br>DEVIL',MENU_P='',OVER_T='';
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}tg.BackButton.show();tg.BackButton.onClick(()=>{location.href='/'})}
fetch('/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:''})}).then(r=>r.json()).then(m=>{if(!m.ok||!m.joined)location.href='/'}).catch(()=>{});
async function submit(){try{await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:GAME,score:Math.floor(score),initData:tg?tg.initData:''})})}catch(e){}}
let best=0;try{best=+localStorage.getItem('leveldevilbest')||0}catch(e){}
let mode='menu',paused=false,muted=false,T=0,score=0,shake=0,flash=0;
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty='sine',v=.06,sl=0,delay=0){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+delay;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d)}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function over(){mode='over';if(score>best){best=Math.floor(score);try{localStorage.setItem('leveldevilbest',best)}catch(e){}}submit();show('over')}
/* ---- game code ---- */
const GY=500,SPD=200,GRAV=1500,JV=-520;
const MAPS=[
 {n:'Green Hills',e:'🌿',sky:['#7ed0ff','#d9f5ff'],gr:'#5aa845',dirt:'#7a5230',stick:'#111',acc:'#3fae5a',mods:['spikeRow','hid','pitSpike','fall','ceil','block','dHid','pit']},
 {n:'Desert Ruins',e:'🏜️',sky:['#ffcf8a','#fff0cf'],gr:'#e0b45a',dirt:'#b88a3a',stick:'#111',acc:'#e8a53a',mods:['saw','block','vanish','spikeRow','stairs','hid','dVan','pitSpike']},
 {n:'Ice Cave',e:'❄️',sky:['#8fc0ee','#e8f6ff'],gr:'#d6efff',dirt:'#7fa9d4',stick:'#0e2748',acc:'#4aa8e8',mods:['ceil','fall','spikeRow','pitSpike','stairs','saw','dHid','block']},
 {n:'Lava Castle',e:'🌋',sky:['#3a0d12','#8a2a1a'],gr:'#6a5760',dirt:'#2e2328',stick:'#fff',acc:'#ef5b2a',mods:['fire','mover','vanish','hid','ceil','pitSpike','dVan','dHid']}];
function rngf(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const gnd=(L,x,w)=>L.ground.push({x,w});
const MOD={
 spikeRow(L,x,r,d){const pre=90+r()*60,n=1+Math.floor(r()*(1+d*2)),w=n*22;gnd(L,x,pre+w+90);L.hz.push({t:'spike',x:x+pre,w,h:18});return x+pre+w+90},
 hid(L,x,r,d){const pre=120+r()*80;gnd(L,x,pre+120);L.hz.push({t:'hid',x:x+pre,w:24,up:0,trig:x+pre-40-r()*8});return x+pre+120},
 pit(L,x,r,d){const gap=60+d*40+r()*20;gnd(L,x,100);gnd(L,x+100+gap,100);return x+200+gap},
 fall(L,x,r,d){const n=3+Math.floor(r()*3),dl=.2-d*.06;gnd(L,x,90);for(let i=0;i<n;i++)L.tiles.push({t:'fall',x:x+90+i*50,w:50,st:0,tm:0,dl,oy:0,vy:0,stand:0});gnd(L,x+90+n*50,90);return x+180+n*50},
 ceil(L,x,r,d){const pre=150+r()*60;gnd(L,x,pre+150);L.hz.push({t:'ceil',x:x+pre,w:26,h:40,y:0,vy:0,fall:0,land:0,trig:x+pre-165+d*20});return x+pre+150},
 block(L,x,r,d){const pre=140+r()*50;gnd(L,x,pre+200);L.solids.push({x:x+pre,w:28,h:38+r()*14,hc:0,on:0,trig:x+pre-52});return x+pre+200},
 saw(L,x,r,d){gnd(L,x,520);L.hz.push({t:'saw',on:0,x:0,sp:270+d*110,rot:0,trig:x+80});return x+520},
 vanish(L,x,r,d){const pre=110+r()*40;gnd(L,x,pre);L.tiles.push({t:'van',x:x+pre,w:70,st:0,trig:x+pre-56});gnd(L,x+pre+70,110);return x+pre+180},
 stairs(L,x,r,d){const n=3+Math.floor(r()*2);gnd(L,x,90);let cx=x+120;for(let i=0;i<n;i++){L.plats.push({x:cx,y:GY-(i%2?85:45),w:64});cx+=110}gnd(L,cx,90);return cx+90},
 pitSpike(L,x,r,d){const gap=70+d*25+r()*12;gnd(L,x,100);gnd(L,x+100+gap,85+22+130);L.hz.push({t:'spike',x:x+100+gap+85,w:22,h:18});return x+100+gap+85+22+130},
 dHid(L,x,r,d){const pre=120+r()*50;gnd(L,x,pre+360);L.hz.push({t:'hid',x:x+pre,w:24,up:0,trig:x+pre-40},{t:'hid',x:x+pre+230,w:24,up:0,trig:x+pre+190});return x+pre+360},
 dVan(L,x,r,d){const pre=110+r()*30;gnd(L,x,pre);L.tiles.push({t:'van',x:x+pre,w:64,st:0,trig:x+pre-56});gnd(L,x+pre+64,95);L.tiles.push({t:'van',x:x+pre+159,w:64,st:0,trig:x+pre+159-56});gnd(L,x+pre+223,110);return x+pre+333},
 fire(L,x,r,d){const gap=110+d*20;gnd(L,x,100);L.hz.push({t:'fire',x:x+100+gap/2,ph:r(),per:1.5-d*.3});gnd(L,x+100+gap,100);return x+200+gap},
 mover(L,x,r,d){const w=84,rg=90+d*20;gnd(L,x,80);L.tiles.push({t:'mov',x:x+80,w,x0:x+80,cx:x+80,rg,sp:1.4+d*.4,ph:r()*6,stand:0});gnd(L,x+80+rg+w+70,90);return x+80+rg+w+160}};
function makeLevel(map,level){const r=rngf(map*7919+level*104729+13),d=Math.min(1,.3+level/28),L={ground:[],plats:[],hz:[],tiles:[],solids:[],goal:null,W:0};
 let x=0;gnd(L,0,280);x=280;const n=Math.min(18,5+Math.floor(level*.6)),mods=MAPS[map].mods;
 for(let i=0;i<n;i++){const safe=28+(1-d)*34;gnd(L,x,safe);x+=safe;x=MOD[mods[Math.floor(r()*mods.length)]](L,x,r,d)}
 gnd(L,x,440);L.goal={x:x+170,runs:r()<.6,ran:0,sl:0};L.W=x+440;return L}
let map=0,level=1,L=null,cam=0,deaths=0,prog=[1,1,1,1],jb=0,cy=0,deadT=0,clearT=0,carryX=0,bannerT=0;
const p={x:60,y:GY,vx:0,vy:0,on:false,face:1,anim:0,dead:0};
const K={l:0,r:0};let fx=[];
const totalCleared=()=>prog.reduce((a,b)=>a+b-1,0);
function loadProg(){try{const a=JSON.parse(localStorage.getItem('ld_prog')||'[]');for(let i=0;i<4;i++)prog[i]=Math.max(1,+a[i]||1)}catch(e){}}
function saveProg(){try{localStorage.setItem('ld_prog',JSON.stringify(prog))}catch(e){}}
function reset(){loadProg();score=totalCleared();deaths=0;map=0;level=prog[0];loadLevel()}
function loadLevel(){L=makeLevel(map,level);p.x=60;p.y=GY;p.vx=p.vy=0;p.on=true;p.dead=0;cam=0;deadT=0;clearT=0;fx=[];jb=0}
function startMap(m){map=m;level=prog[m];deaths=0;mode='play';paused=false;loadLevel();$('ov').style.display='none';hc=''}
function die(){if(p.dead||clearT>0)return;p.dead=1;deadT=.75;deaths++;shake=10;tone(160,.35,'sawtooth',.09,-90);for(let i=0;i<14;i++){const a=R(0,6.28),s=R(60,300);fx.push({x:p.x,y:p.y-18,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,l:R(.5,1),c:MAPS[map].stick,rot:R(0,6)})}}
function clear(){if(p.dead||clearT>0)return;clearT=1.1;prog[map]=level+1;saveProg();score=totalCleared();submit();[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.07,0,i*.09))}
function surfaces(){const s=[];for(const g of L.ground)s.push({x:g.x,y:GY,w:g.w});for(const q of L.plats)s.push({x:q.x,y:q.y,w:q.w});
 for(const t of L.tiles){if(t.t==='fall'&&t.st<1)s.push({x:t.x,y:GY,w:t.w,ref:t});else if(t.t==='van'&&t.st===0)s.push({x:t.x,y:GY,w:t.w});else if(t.t==='mov')s.push({x:t.cx,y:GY,w:t.w,ref:t})}
 for(const b of L.solids)if(b.on&&b.hc>8)s.push({x:b.x,y:GY-b.hc,w:b.w});return s}
function hitRect(ax,ay,aw,ah){return p.x+7>ax&&p.x-7<ax+aw&&p.y>ay&&p.y-34<ay+ah}
function update(dt){T+=dt;fxStep(dt);
 if(clearT>0){clearT-=dt;if(clearT<=0){level++;loadLevel()}return}
 if(p.dead){deadT-=dt;if(deadT<=0)loadLevel();return}
 let carry=0;for(const t of L.tiles)if(t.t==='mov'){const o=t.cx;t.cx=t.x0+(Math.sin(T*t.sp+t.ph)*.5+.5)*t.rg;if(t.stand)carry+=t.cx-o;t.stand=0}
 const ax=K.r-K.l;p.vx=ax*SPD;if(ax)p.face=ax;p.anim+=dt;
 cy=p.on?.09:cy-dt;if(jb>0)jb-=dt;if(jb>0&&cy>0){p.vy=JV;p.on=false;cy=0;jb=0;tone(380,.1,'square',.04,160)}
 p.x=clamp(p.x+p.vx*dt+carry,10,L.W-10);
 for(const b of L.solids){if(!b.on&&p.x>b.trig){b.on=1;tone(120,.12,'square',.05)}if(b.on&&b.hc<b.h)b.hc=Math.min(b.h,b.hc+420*dt);
  if(b.on&&b.hc>8&&p.x+7>b.x&&p.x-7<b.x+b.w&&p.y>GY-b.hc+5){p.x=p.x<b.x+b.w/2?b.x-7:b.x+b.w+7}}
 p.vy+=GRAV*dt;const py=p.y;p.y+=p.vy*dt;p.on=false;
 for(const t of L.tiles)if(t.t==='fall')t.stand=t.stand&&t.st<1?0:0;
 for(const s of surfaces()){if(p.vy>=0&&py<=s.y+6&&p.y>=s.y&&p.x+6>s.x&&p.x-6<s.x+s.w){p.y=s.y;p.vy=0;p.on=true;if(s.ref)s.ref.stand=1}}
 for(const t of L.tiles){if(t.t==='fall'){if(t.stand&&t.st<1){t.tm+=dt;if(t.tm>t.dl){t.st=1;tone(110,.15,'square',.04)}}if(t.st===1){t.vy+=1600*dt;t.oy+=t.vy*dt;if(t.oy>200)t.st=2}}
  else if(t.t==='van'&&t.st===0&&p.x>t.trig){t.st=1;tone(90,.15,'sawtooth',.05)}}
 if(p.y>H+50){die();return}
 for(const h of L.hz){
  if(h.t==='spike'){if(hitRect(h.x+3,GY-h.h+3,h.w-6,h.h-3)){die();return}}
  else if(h.t==='hid'){if(!h.up&&p.x>h.trig){h.up=.01;tone(200,.1,'square',.05)}if(h.up&&h.up<1)h.up=Math.min(1,h.up+dt*9);const hc=h.up*20;if(hc>6&&hitRect(h.x+3,GY-hc,h.w-6,hc)){die();return}}
  else if(h.t==='ceil'){if(!h.fall&&p.x>h.trig)h.fall=1;if(h.fall&&!h.land){h.vy+=2400*dt;h.y+=h.vy*dt;if(h.y+h.h>=GY){h.y=GY-h.h;h.land=1;shake=4}}if(h.fall&&hitRect(h.x+4,h.y+4,h.w-8,h.h-4)){die();return}}
  else if(h.t==='saw'){if(!h.on&&p.x>h.trig){h.on=1;h.x=p.x+290}if(h.on){h.x-=h.sp*dt;h.rot+=dt*14;const nx=clamp(h.x,p.x-7,p.x+7),ny=clamp(GY-14,p.y-34,p.y);if((h.x-nx)**2+(GY-14-ny)**2<144){die();return}}}
  else if(h.t==='fire'){const u=((T/h.per+h.ph)%1),fy=H+20-Math.sin(Math.PI*u)*(H+20-(GY-135));h.fy=fy;const nx=clamp(h.x,p.x-7,p.x+7),ny=clamp(fy,p.y-34,p.y);if(fy<H&&(h.x-nx)**2+(fy-ny)**2<130){die();return}}}
 const g=L.goal;if(g.runs&&!g.ran&&p.x>g.x-125){g.ran=1;g.sl=.26;tone(700,.15,'square',.05)}if(g.sl>0){g.sl-=dt;g.x+=500*dt}
 if(hitRect(g.x,GY-56,36,56))clear();
 cam=clamp(p.x-140,0,Math.max(0,L.W-W))}
function fxStep(dt){for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=900*dt;f.l-=dt}fx=fx.filter(f=>f.l>0);shake*=.88}
function idle(dt){T+=dt;fxStep(dt)}
function tri(x,y,w,h,up){X.beginPath();const n=Math.max(1,Math.round(w/22)),tw=w/n;for(let i=0;i<n;i++){const a=x+i*tw;if(up){X.moveTo(a,y);X.lineTo(a+tw/2,y-h);X.lineTo(a+tw,y)}else{X.moveTo(a,y);X.lineTo(a+tw/2,y+h);X.lineTo(a+tw,y)}}X.fill()}
function hills(c,amp,fq,base,par,sharp){X.fillStyle=c;X.beginPath();X.moveTo(0,H);for(let x=0;x<=W;x+=12){const u=(x+cam*par)*fq;const v=sharp?Math.abs(Math.sin(u)):Math.sin(u)*.5+.5;X.lineTo(x,base-v*amp)}X.lineTo(W,H);X.fill()}
function stick(x,y,f,c){X.save();X.translate(x,y);X.scale(f,1);X.strokeStyle=c;X.lineWidth=4;X.lineCap='round';X.lineJoin='round';
 const air=!p.on,sw=!air&&Math.abs(p.vx)>1?Math.sin(p.anim*16):0;
 X.beginPath();X.arc(0,-29,7,0,6.28);X.stroke();X.beginPath();X.moveTo(0,-22);X.lineTo(0,-10);
 if(air){X.moveTo(0,-10);X.lineTo(8,-3);X.moveTo(0,-10);X.lineTo(-5,0);X.moveTo(0,-19);X.lineTo(8,-27);X.moveTo(0,-19);X.lineTo(-6,-26)}

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Penalty Shootout</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#f4f7ff;--dim:#b4bfd8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b1a12;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px;box-sizing:border-box}
#hud{display:flex;align-items:center;gap:8px;border:1px solid #2f8a50;border-radius:14px;padding:6px 10px;background:#10261a}
.st{flex:1;text-align:center;font-size:10px;color:var(--dim);font-weight:700}.st b{display:block;font-size:17px;color:var(--ink);font-weight:900;white-space:nowrap}
.ib{width:34px;height:34px;font-size:14px;padding:0}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}#c{width:100%;height:100%;display:block;border-radius:16px;border:1px solid #2f8a50;touch-action:none}
#ov{position:absolute;inset:0;border-radius:16px;background:rgba(6,8,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;line-height:1.6}
#ov h1{margin:0;font-size:32px;font-weight:900;color:#7dffb0;text-shadow:0 3px 0 #0007,0 0 18px #000a}
#ov p{margin:0;font-size:13px;color:var(--dim)}#ov .big{font-size:44px;font-weight:900}
.go{padding:13px 40px;font-size:17px}
.go,.ib{isolation:isolate;position:relative;border:2px solid #8f9bff;border-radius:999px;color:#fff;font-weight:900;background:linear-gradient(180deg,#5b78ff 0%,#2c35e6 52%,#1b20b9 100%);box-shadow:0 0 0 1px #0a0f5a,0 4px 14px #2c35e688,inset 0 -3px 7px #0a0e7a99}
.go::before,.ib::before{content:"";position:absolute;z-index:-1;left:9%;right:9%;top:3px;height:44%;border-radius:999px;background:linear-gradient(180deg,#ffffffb3,#ffffff14);pointer-events:none}
.go:active,.ib:active{transform:translateY(1px) scale(.97);filter:brightness(.92)}
.go.rk{background:linear-gradient(180deg,#c084fc 0%,#7e22ce 52%,#581c87 100%);border-color:#e9d5ff;padding:10px 30px;font-size:14px}
#rkm{position:fixed;inset:0;background:rgba(5,3,20,.78);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.rkc{width:min(100%,360px);max-height:80%;overflow:auto;background:linear-gradient(180deg,#2a1670,#0f0a3a);border:1px solid #ffffff2e;border-radius:26px;padding:18px;box-shadow:0 20px 50px #000a;text-align:center;color:#fff;font-family:system-ui,sans-serif}
.rkc h2{margin:0 0 12px;font-size:24px;font-weight:900}
.rkl{text-align:left;margin-bottom:14px;color:#cfc9f7;font-size:14px}
.rkr{display:flex;gap:10px;align-items:center;background:#ffffff14;border-radius:14px;padding:10px 12px;margin-bottom:8px;color:#fff}
.rkr span:first-child{width:30px;text-align:center;font-weight:900}.rkr span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.rkr span:last-child{font-weight:900;color:#ffd84d}
.rkr.me{outline:2px solid #a78bfa;background:#a78bfa33}
</style></head><body><div id="app">
<div id="hud"><div class="st">STREAK<b id="hl">0</b></div><div class="st">SCORE<b id="hs">0</b></div><div class="st">LIVES<b id="ha">0</b></div><button class="ib" id="bp">⏸</button><button class="ib" id="bm">🔊</button></div>
<div id="stage"><div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),W=360,H=640;C.width=W;C.height=H;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const GAME='penalty',MENU_T='PENALTY<br>SHOOTOUT',MENU_P='Drag to aim, release to shoot.<br>Beat the keeper. Top corners score double. 3 misses and you are out.',OVER_T='FULL TIME';
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}tg.BackButton.show();tg.BackButton.onClick(()=>{location.href='/'})}
fetch('/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:''})}).then(r=>r.json()).then(m=>{if(!m.ok||!m.joined)location.href='/'}).catch(()=>{});
async function submit(){try{await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:GAME,score:Math.floor(score),initData:tg?tg.initData:''})})}catch(e){}}
let best=0;try{best=+localStorage.getItem('penaltybest')||0}catch(e){}
let mode='menu',paused=false,muted=false,T=0,score=0,shake=0,flash=0;
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty='sine',v=.06,sl=0,delay=0){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+delay;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d)}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function over(){mode='over';if(score>best){best=Math.floor(score);try{localStorage.setItem('penaltybest',best)}catch(e){}}submit();show('over')}
/* ---- game code ---- */
const GL=80,GR=280,GT=150,GB=250,GCX=180,BX=180,BY=480;
let st='aim',lives=3,streak=0,ball={x:BX,y:BY,s:1,r:0,vx:0,vy:0},tgt=null,t0=0,D=.55,kt={x:GCX,y:GB-8},kd=.12,res='',resC='#fff',resT=0,netFlash=0,aim=null,aimFrom=null,out='',fx=[],pops=[],ksway=0,hint=true;
const crowd=Array.from({length:150},()=>({x:R(0,W),y:R(6,112),c:['#ef4444','#f59e0b','#3b82f6','#e5e7eb','#a855f7','#22c55e'][Math.floor(R(0,6))],p:R(0,6.28)}));
function resetBall(){ball={x:BX,y:BY,s:1,r:0,vx:0,vy:0};st='aim';tgt=null;res='';aim=null;aimFrom=null}
function reset(){score=0;lives=3;streak=0;T=0;fx=[];pops=[];shake=0;flash=0;hint=true;resetBall()}
const pop=(x,y,s,c)=>pops.push({x,y,s,c,l:1});
function spark(x,y,n,c){for(let i=0;i<n&&fx.length<200;i++){const a=R(0,6.28),s=R(40,220);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:R(.3,.7),c})}}
function shoot(ex,ey){tgt={x:clamp(ex,-30,W+30),y:clamp(ey,60,BY-40)};st='shot';t0=T;hint=false;
 const noise=Math.max(0.9,1.6-streak*0.04)*70;kt={x:clamp(tgt.x+R(-noise,noise),GL+12,GR-12),y:clamp(tgt.y+R(-noise*.5,noise*.5),GT+28,GB-6)};
 if(Math.random()<Math.max(0.15,0.6-streak*0.03))kt={x:R(GL+20,GR-20),y:R(GT+30,GB-6)};
 D=Math.max(.38,.55-streak*.008);tone(180,.12,'square',.07,-60)}
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function keeper(){let kp=0;if(st==='shot'||st==='res')kp=ease((T-t0-kd)/.36);return{x:GCX+(kt.x-GCX)*kp+(kp?0:Math.sin(T*2)*18),y:(GB-8)+(kt.y-(GB-8))*kp-Math.sin(kp*3.14)*10,rot:((kt.x-GCX)/100)*kp,kp}}
function finish(){const inF=tgt.x>GL+6&&tgt.x<GR-6&&tgt.y>GT+4&&tgt.y<=GB+6;const k=keeper();
 if(inF){const saved=((tgt.x-k.x)/40)**2+((tgt.y-k.y)/30)**2<1;
  if(saved){out='save';res='SAVED!';resC='#ff6b6b';lives--;streak=0;ball.vx=(tgt.x<k.x?-1:1)*160;ball.vy=140;shake=8;tone(140,.3,'sawtooth',.08,-70)}
  else{out='goal';let p=1;const corner=(tgt.x<GL+34||tgt.x>GR-34)&&tgt.y<GT+36;if(corner){p=2;pop(tgt.x,tgt.y-30,'TOP CORNER +1','#7dffb0')}score+=p;streak++;res='GOAL!';resC='#ffd84d';spark(tgt.x,tgt.y,30,'#ffe066');shake=6;[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.07,0,i*.08))}}
 else{out='miss';res=tgt.y<GT?'HIGH!':tgt.y>GB+6?'SHORT!':'WIDE!';resC='#ff9a5a';lives--;streak=0;tone(200,.3,'sine',.06,-80)}
 st='res';resT=1.25;ball.x=tgt.x;ball.y=tgt.y;ball.s=.5}
function update(dt){T+=dt;idle(dt,true);
 if(st==='shot'){const tt=(T-t0)/D;if(tt<1){ball.x=BX+(tgt.x-BX)*tt;ball.y=BY+(tgt.y-BY)*tt-Math.sin(3.14*tt)*28;ball.s=1-.55*tt;ball.r+=dt*16}else finish()}
 else if(st==='res'){resT-=dt;if(out==='save'){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.r+=dt*10}
  if(resT<=0){if(lives<=0)die();else resetBall()}}}
function die(){if(mode!=='play')return;mode='dead';setTimeout(over,300)}
function idle(dt,play){if(!play)T+=dt;for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=500*dt;f.l-=dt}fx=fx.filter(f=>f.l>0);for(const p of pops){p.y-=26*dt;p.l-=dt*.9}pops=pops.filter(p=>p.l>0);shake*=.88;flash=Math.max(0,flash-dt*2.5);netFlash=Math.max(0,netFlash-dt*2)}
function ballDraw(x,y,s){const r=15*s;X.save();X.translate(x,y);X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(2,r+2,r*.9,r*.3,0,0,6.28);X.fill();X.rotate(ball.r);
 const g=X.createRadialGradient(-r*.3,-r*.3,r*.2,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfd3da');X.fillStyle=g;X.beginPath();X.arc(0,0,r,0,6.28);X.fill();X.strokeStyle='#222';X.lineWidth=1;X.stroke();
 X.fillStyle='#222';X.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.57;X.lineTo(Math.cos(a)*r*.42,Math.sin(a)*r*.42)}X.closePath();X.fill();
 for(let i=0;i<5;i++){const a=i*1.2566-1.57;X.beginPath();X.arc(Math.cos(a)*r*.84,Math.sin(a)*r*.84,r*.2,0,6.28);X.fill()}X.restore()}
function keeperDraw(k){X.save();X.translate(k.x,k.y);X.rotate(k.rot);const up=k.kp;
 X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(0,34,22,6,0,0,6.28);X.fill();
 X.fillStyle='#111';rr(-10,10,8,20,3);X.fill();rr(2,10,8,20,3);X.fill();X.fillStyle='#facc15';rr(-10,24,8,10,3);X.fill();rr(2,24,8,10,3);X.fill();
 X.strokeStyle='#f97316';X.lineWidth=8;X.lineCap='round';
 const al=[[-16,-8,-24-10*up,10-34*up],[16,-8,24+10*up,10-34*up]];for(const a of al){X.beginPath();X.moveTo(a[0]*.8,a[1]);X.lineTo(a[2],a[3]);X.stroke()}
 const gr=X.createLinearGradient(0,-18,0,14);gr.addColorStop(0,'#fb923c');gr.addColorStop(1,'#ea580c');X.fillStyle=gr;rr(-14,-18,28,32,7);X.fill();X.fillStyle='#fff';X.fillRect(-14,-6,28,4);
 X.fillStyle='#22c55e';X.strokeStyle='#fff';X.lineWidth=1.5;for(const a of al){X.beginPath();X.arc(a[2],a[3],7,0,6.28);X.fill();X.stroke()}
 X.fillStyle='#f1c08f';X.beginPath();X.arc(0,-28,9,0,6.28);X.fill();X.fillStyle='#3b2a1a';X.beginPath();X.arc(0,-31,9,3.3,6.1);X.fill();X.fillStyle='#222';X.fillRect(-4,-28,2,2);X.fillRect(2,-28,2,2);X.restore()}
function pitch(){let g=X.createLinearGradient(0,0,0,120);g.addColorStop(0,'#10162b');g.addColorStop(1,'#24305c');X.fillStyle=g;X.fillRect(-20,-20,W+40,146);
 for(const c of crowd){X.fillStyle=c.c;X.globalAlpha=.85;X.fillRect(c.x,c.y+Math.sin(T*3+c.p)*1.2,5,6)}X.globalAlpha=1;
 X.fillStyle='#10223f';X.fillRect(0,118,W,26);X.fillStyle='#ffd84d';X.font='900 11px system-ui,sans-serif';X.textAlign='center';for(let i=0;i<3;i++)X.fillText('PCREW GAMES',60+i*120,135);
 for(let i=0;i<14;i++){const y0=144+Math.pow(i/14,1.6)*500,y1=144+Math.pow((i+1)/14,1.6)*500;X.fillStyle=i%2?'#2f9a46':'#37a84e';X.fillRect(-20,y0,W+40,y1-y0+1)}
 X.strokeStyle='rgba(255,255,255,.8)';X.lineWidth=3;X.strokeRect(30,GB,300,250);X.strokeRect(100,GB,160,60);X.beginPath();X.moveTo(0,GB);X.lineTo(W,GB);X.stroke();
 X.beginPath();X.arc(180,BY,3,0,6.28);X.fillStyle='#fff';X.fill();X.beginPath();X.ellipse(180,500,56,18,0,0,3.14);X.stroke()}
function goalBack(){X.fillStyle='rgba(15,35,25,.5)';X.fillRect(GL,GT,GR-GL,GB-GT);X.strokeStyle='rgba(255,255,255,'+(.3+netFlash*.5)+')';X.lineWidth=1;X.beginPath();for(let x=GL;x<=GR;x+=14){X.moveTo(x,GT);X.lineTo(x,GB)}for(let y=GT;y<=GB;y+=12){X.moveTo(GL,y);X.lineTo(GR,y)}X.stroke()}
function goalFrame(){X.strokeStyle='#fff';X.lineWidth=7;X.lineCap='round';X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=6;X.beginPath();X.moveTo(GL,GB+2);X.lineTo(GL,GT);X.lineTo(GR,GT);X.lineTo(GR,GB+2);X.stroke();X.shadowBlur=0}
function draw(){
 X.save();if(shake>.3)X.translate(R(-shake,shake),R(-shake,shake));
 pitch();goalBack();keeperDraw(keeper());
 if(out==='goal'&&st==='res')netFlash=1;
 ballDraw(ball.x,ball.y,ball.s);goalFrame();
 if(aim&&st==='aim'){X.strokeStyle='rgba(255,255,255,.85)';X.lineWidth=3;X.setLineDash([8,8]);X.beginPath();X.moveTo(BX,BY);X.lineTo(aim.x,aim.y);X.stroke();X.setLineDash([]);
  X.strokeStyle='#ffd84d';X.lineWidth=3;X.beginPath();X.arc(aim.x,aim.y,14,0,6.28);X.moveTo(aim.x-20,aim.y);X.lineTo(aim.x+20,aim.y);X.moveTo(aim.x,aim.y-20);X.lineTo(aim.x,aim.y+20);X.stroke()}
 for(const f of fx){X.globalAlpha=Math.min(1,f.l*3);X.fillStyle=f.c;X.fillRect(f.x,f.y,3,3)}X.globalAlpha=1;
 X.textAlign='center';
 if(st==='res'){X.font='900 54px Impact,system-ui,sans-serif';X.lineWidth=8;X.strokeStyle='rgba(0,0,0,.6)';X.strokeText(res,W/2,330);X.fillStyle=resC;X.fillText(res,W/2,330)}
 if(hint&&st==='aim'&&mode==='play'){X.font='900 16px system-ui,sans-serif';X.lineWidth=4;X.strokeStyle='rgba(0,0,0,.6)';X.strokeText('DRAG TO AIM, RELEASE TO SHOOT',W/2,590);X.fillStyle='#fff';X.fillText('DRAG TO AIM, RELEASE TO SHOOT',W/2,590)}
 X.font='900 16px system-ui,sans-serif';for(const p of pops){X.globalAlpha=Math.min(1,p.l*1.5);X.lineWidth=4;X.strokeStyle='rgba(0,0,0,.6)';X.strokeText(p.s,p.x,p.y);X.fillStyle=p.c;X.fillText(p.s,p.x,p.y)}X.globalAlpha=1;
 X.restore()}
const hudVals=()=>[streak,'♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives))];
const overSub=()=>'Best streak shots';
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function aimAt(p){return{x:BX+(p.x-aimFrom.x)*1.7,y:BY+(p.y-aimFrom.y)*1.7}}
C.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(mode!=='play'||paused||st!=='aim')return;aimFrom=pos(e);aim=null;try{C.setPointerCapture(e.pointerId)}catch(x){}});
C.addEventListener('pointermove',e=>{if(!aimFrom||st!=='aim')return;const p=pos(e);if(Math.hypot(p.x-aimFrom.x,p.y-aimFrom.y)>10)aim=aimAt(p)});
C.addEventListener('pointerup',e=>{if(!aimFrom){return}const p=pos(e);const len=Math.hypot(p.x-aimFrom.x,p.y-aimFrom.y);const a=aimAt(p);aimFrom=null;if(st==='aim'&&mode==='play'&&len>30&&a.y<BY-60)shoot(a.x,a.y);aim=null});
C.addEventListener('pointercancel',()=>{aimFrom=null;aim=null});

/* ---- common ---- */
const RK='<button class="go rk" id="rk">🏆 Ranking</button>';
let hc='';function hud(){const v=hudVals(),h=v.join('|')+'|'+Math.floor(score);if(h===hc)return;hc=h;$('hl').textContent=v[0];$('hs').textContent=Math.floor(score);$('ha').textContent=v[1]}
function show(k){const o=$('ov');o.style.display='flex';
 if(k=='menu')o.innerHTML='<h1>'+MENU_T+'</h1><p>'+MENU_P+'</p><p>BEST '+best+'</p><button class="go" id="go">PLAY</button>'+RK;
 else if(k=='over')o.innerHTML='<p>'+OVER_T+'</p><div class="big">'+Math.floor(score)+'</div><p>'+overSub()+' · BEST '+best+'</p><button class="go" id="go">RETRY</button>'+RK;
 else o.innerHTML='<h1>PAUSED</h1><button class="go" id="go">RESUME</button>';
 $('go').onclick=()=>{ac();if(k=='pause')togglePause();else{reset();mode='play';hc='';o.style.display='none'}}}
function togglePause(){if(mode!=='play')return;paused=!paused;if(paused)show('pause');else $('ov').style.display='none'}
$('bp').onclick=togglePause;$('bm').onclick=()=>{muted=!muted;$('bm').textContent=muted?'🔇':'🔊'};
addEventListener('keydown',e=>{if(e.key=='p'||e.key=='P'||e.key=='Escape')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused)togglePause()});
addEventListener('contextmenu',e=>e.preventDefault());
function fit(){const s=$('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H),e=$('wrap');e.style.width=W*k+'px';e.style.height=H*k+'px'}
function openRank(){if($('rkm'))return;const m=document.createElement('div');m.id='rkm';const c=document.createElement('div');c.className='rkc';const t=document.createElement('h2');t.textContent='🏆 Ranking';const l=document.createElement('div');l.className='rkl';l.textContent='Loading...';const b=document.createElement('button');b.className='go';b.textContent='Close';c.append(t,l,b);m.append(c);document.body.append(m);b.onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
 const me=((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{}).first_name||'';
 fetch('/api/leaderboard?game=penalty').then(r=>r.json()).then(r=>{l.textContent='';if(!r.length){l.textContent='No scores yet. Be the first!';return}
  r.forEach((x,i)=>{const d=document.createElement('div');d.className='rkr'+(x.name===me.slice(0,20)?' me':'');const a=document.createElement('span');a.textContent=['🥇','🥈','🥉'][i]||String(i+1);const n=document.createElement('span');n.textContent=x.name;const s=document.createElement('span');s.textContent=x.score;d.append(a,n,s);l.append(d)})}).catch(()=>{l.textContent='Could not load ranking'})}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#rk'))openRank()});
addEventListener('resize',fit);fit();reset();show('menu');
let last=performance.now();(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(!paused){if(mode==='play')update(dt);else idle(dt)}draw();hud();requestAnimationFrame(loop)})(last);
</script></body></html>

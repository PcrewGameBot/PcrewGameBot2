<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Thunderstorm Survival</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030617;--ink:#e6f4ff;--dim:#7fa6c9;--glow:#2ec8ff;--warn:#ffd23f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Orbitron,"Segoe UI",system-ui,"Noto Sans Myanmar",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px;box-sizing:border-box}
#hud{display:flex;align-items:center;gap:8px;border:1px solid #1d5fa8;border-radius:12px;padding:6px 10px;background:#06142e}
.st{flex:1;text-align:center;font-size:10px;color:var(--dim)}.st b{display:block;font-size:15px;color:var(--ink);font-weight:800}
#hp{font-size:14px;color:#ff5d7d;min-width:64px;text-align:center}
.ib{background:none;border:1px solid #1d5fa8;color:var(--ink);border-radius:8px;width:32px;height:32px;font-size:14px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}#c{width:100%;height:100%;display:block;border-radius:14px;border:1px solid #1d5fa8}
#ov{position:absolute;inset:0;border-radius:14px;background:rgba(3,6,23,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;line-height:1.7}
#ov h1{margin:0;font-size:26px;font-weight:800;color:var(--glow);text-shadow:0 0 16px var(--glow)}
#ov p{margin:0;font-size:13px;color:var(--dim)}#ov .big{font-size:34px;color:var(--ink);font-weight:800}
.go{background:var(--glow);color:#02132b;border:0;border-radius:12px;padding:12px 34px;font:800 16px Orbitron,sans-serif;margin-top:6px}
#ctl{display:flex;justify-content:space-between;gap:10px;height:78px}
#ctl div{display:flex;gap:10px}
.cb{width:84px;height:78px;border-radius:16px;border:1px solid #2a7fd0;background:#07204a;color:var(--ink);font-size:28px}
.cb:active{background:#0e3a7a}#bj{width:120px;background:#0b3a6e;font-size:16px;font-weight:800}
@media (min-width:700px){#ctl{display:none}}

/* Glossy gradient pill buttons */
.go,.cb,.ib{isolation:isolate;border:2px solid #8f9bff;border-radius:999px;color:#fff;font-weight:900;background:linear-gradient(180deg,#5b78ff 0%,#2c35e6 52%,#1b20b9 100%);box-shadow:0 0 0 1px #0a0f5a,0 4px 14px #2c35e688,inset 0 -3px 7px #0a0e7a99;position:relative}
.go::before,.cb::before,.ib::before{content:"";position:absolute;z-index:-1;left:9%;right:9%;top:3px;height:44%;border-radius:999px;background:linear-gradient(180deg,#ffffffb3,#ffffff14);pointer-events:none}
.go:active,.cb:active,.ib:active{transform:translateY(1px) scale(.97);filter:brightness(.92)}
.go{padding:12px 36px;font-size:16px}
</style></head><body><div id="app">
<div id="hud"><div class="st">LEVEL<b id="hl">1</b></div><div class="st">TIME<b id="ht">0:00.0</b></div><div class="st">SCORE<b id="hs">0</b></div><div class="st">COMBO<b id="hc">x1</b></div><div id="hp"></div><button class="ib" id="bp">⏸</button><button class="ib" id="bm">🔊</button></div>
<div id="stage"><div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div></div>
<div id="ctl"><div><button class="cb" id="bl">◀</button><button class="cb" id="br">▶</button></div><button class="cb" id="bj">JUMP</button></div>
</div>
<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),W=360,H=640,G=560,HZ=390;C.width=W;C.height=H;
const R=(a,b)=>a+Math.random()*(b-a);
let best=0;try{best=+localStorage.getItem('tss_best')||0}catch(e){}
let mode='menu',paused=false,muted=false,T=0,score=0,combo=0,comboT=0,lives=3,level=1,inv=0,shield=false,slow=0,shake=0,flash=0,bT=1,oT=2,pT=10,lastLv=1;
let bolts=[],orbs=[],picks=[],waves=[],fx=[],pops=[];
const P={x:W/2,y:G,vx:0,vy:0,j:0,f:1},K={l:0,r:0};
const rain=Array.from({length:70},()=>({x:R(0,W),y:R(0,H),s:R(500,800)}));
const stars=Array.from({length:50},()=>({x:R(0,W),y:R(0,HZ),r:R(.4,1.4),a:R(.2,.8)}));
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty='sine',v=.07,sl=0){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start();o.stop(n+d)}
function boom(){if(muted)return;const a=ac();if(!a)return;const n=a.sampleRate*.5,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=500;g.gain.value=.5;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function reset(){T=0;score=0;combo=0;comboT=0;lives=5;level=1;lastLv=1;inv=0;shield=false;slow=0;shake=0;flash=0;bT=2.5;oT=4;pT=8;bolts=[];orbs=[];picks=[];waves=[];fx=[];pops=[];Object.assign(P,{x:W/2,y:G,vx:0,vy:0,j:0})}
const mult=()=>Math.min(8,1+(combo>>1));
const pop=(x,y,s,c)=>pops.push({x,y,s,c,l:1});
function spark(x,y,n,c){for(let i=0;i<n;i++){const a=R(0,6.28),v=R(40,220);fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:R(.3,.7),c})}}
function dodge(x,y){combo++;comboT=4;const m=mult();score+=10*m;pop(x,y-60,'+'+10*m,'#7dffb0');tone(660+Math.min(combo,12)*40,.08,'triangle',.05)}
function hurt(){if(inv>0||mode!=='play')return;inv=2;shake=14;flash=.6;if(shield){shield=false;pop(P.x,P.y-60,'SHIELD','#2ec8ff');tone(200,.25,'sawtooth',.08,-120);spark(P.x,P.y-20,18,'#2ec8ff');return}
lives--;combo=0;spark(P.x,P.y-20,24,'#ff4d6d');tone(120,.4,'sawtooth',.12,-80);boom();if(lives<=0)over()}
function over(){mode='over';submit();if(score>best){best=score;try{localStorage.setItem('tss_best',Math.floor(best))}catch(e){}}show('over')}
function jump(){if(mode!=='play'||paused)return;if(P.j<2){P.vy=P.j?-560:-640;P.j++;tone(P.j>1?520:380,.12,'square',.04,200);spark(P.x,P.y,5,'#9fe8ff')}}
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}tg.BackButton.show();tg.BackButton.onClick(()=>{location.href='/'})}
fetch('/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:''})}).then(r=>r.json()).then(m=>{if(!m.ok||!m.joined)location.href='/'}).catch(()=>{});
const esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
async function loadLb(){try{const r=await (await fetch('/api/leaderboard?game=thunderstorm')).json(),e=$('lb');if(e)e.innerHTML=r.slice(0,5).map((x,i)=>(i+1)+'. '+esc(x.name)+' - '+x.score).join('<br>')}catch(e){}}
async function submit(){try{await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'thunderstorm',score:Math.floor(score),initData:tg?tg.initData:''})})}catch(e){}loadLb()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function update(dt){
 T+=dt;level=1+Math.floor(T/20);score+=dt*10;
 if(level>lastLv){lastLv=level;pop(W/2,200,'LEVEL '+level,'#ffd23f');tone(440,.3,'triangle',.07,440)}
 const sd=slow>0?dt*.55:dt;slow=Math.max(0,slow-dt);inv=Math.max(0,inv-dt);comboT-=dt;if(comboT<=0)combo=0;
 const d=K.r-K.l;if(d)P.f=d;P.vx+=(d*260-P.vx)*Math.min(1,dt*14);P.x=clamp(P.x+P.vx*dt,14,W-14);
 P.vy+=1700*dt;P.y+=P.vy*dt;if(P.y>=G){P.y=G;P.vy=0;P.j=0}
 if((bT-=sd)<=0){const n=level>=6&&Math.random()<.35?2:1;for(let i=0;i<n;i++){const x=Math.random()<.4?clamp(P.x+R(-90,90),24,W-24):R(24,W-24);bolts.push({x,age:0,tw:Math.max(.6,1.6-level*.07),st:0,hit:0});tone(900,.08,'square',.025)}bT=Math.max(.6,3.4-level*.15)*R(.8,1.2)}
 if((oT-=sd)<=0){orbs.push({x:R(20,W-20),y:-20,vx:level>=5?R(-40,40):0,vy:120+level*14,r:R(8,12)});oT=Math.max(.45,2.8-level*.14)*R(.8,1.2)}
 if((pT-=dt)<=0){picks.push({x:R(30,W-30),y:-20,k:Math.random()<.5?'s':'t',life:7});pT=R(12,18)}
 for(const b of bolts){b.age+=sd;
  if(b.st==0&&b.age>=b.tw){b.st=1;b.age=0;shake=Math.max(shake,9);flash=.55;boom();spark(b.x,G,16,'#ffd23f');for(const dr of[-1,1])waves.push({x:b.x,d:dr,ah:(P.x-b.x)*dr>0,hit:0})}
  else if(b.st==1){if(!b.hit&&Math.abs(P.x-b.x)<22){b.hit=1;hurt()}if(b.age>=.22){b.dead=1;if(!b.hit&&Math.abs(P.x-b.x)<100)dodge(b.x,G)}}}
 for(const w of waves){w.x+=w.d*Math.min(270,180+level*10)*sd;if(!w.hit&&P.y>G-18&&Math.abs(P.x-w.x)<12){w.hit=1;hurt()}
  const ah=(P.x-w.x)*w.d>0;if(w.ah&&!ah&&!w.hit)dodge(P.x,P.y);w.ah=ah;if(w.x<-10||w.x>W+10)w.dead=1}
 for(const o of orbs){o.x+=o.vx*sd;o.y+=o.vy*sd;if(o.x<o.r||o.x>W-o.r)o.vx*=-1;
  const nx=clamp(o.x,P.x-8,P.x+8),ny=clamp(o.y,P.y-40,P.y);if((o.x-nx)**2+(o.y-ny)**2<=o.r*o.r){o.hit=1;o.dead=1;spark(o.x,o.y,10,'#bfeaff');hurt()}
  else if(o.y>=G-o.r){o.dead=1;spark(o.x,G,8,'#6fd0ff');tone(90,.15,'sine',.08,-40);if(Math.abs(P.x-o.x)<55)dodge(o.x,G)}}
 for(const p of picks){p.y=Math.min(G-12,p.y+80*dt);if(p.y>=G-12)p.life-=dt;if(p.life<=0)p.dead=1;
  if(Math.abs(P.x-p.x)<20&&P.y-44<p.y+8&&P.y>p.y-8){p.dead=1;if(p.k=='s'){shield=true;pop(P.x,P.y-60,'SHIELD ON','#2ec8ff')}else{slow=5;pop(P.x,P.y-60,'SLOW TIME','#ffd23f')}tone(700,.2,'triangle',.07,500);spark(p.x,p.y,12,'#fff')}}
 bolts=bolts.filter(b=>!b.dead);waves=waves.filter(w=>!w.dead);orbs=orbs.filter(o=>!o.dead);picks=picks.filter(p=>!p.dead)}
function ambient(dt){for(const r of rain){r.y+=r.s*dt;if(r.y>H){r.y=-10;r.x=R(0,W)}}
 for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=500*dt;f.l-=dt}fx=fx.filter(f=>f.l>0);
 for(const p of pops){p.y-=30*dt;p.l-=dt*1.1}pops=pops.filter(p=>p.l>0);shake*=.9;flash=Math.max(0,flash-dt*2.5)}
function jag(x1,y1,x2,y2,n,j){const p=[[x1,y1]];for(let i=1;i<n;i++){const t=i/n;p.push([x1+(x2-x1)*t+R(-j,j),y1+(y2-y1)*t])}p.push([x2,y2]);return p}
function path(p){X.beginPath();p.forEach((q,i)=>i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1]));X.stroke()}
function draw(){
 X.save();if(shake>.3)X.translate(R(-shake,shake),R(-shake,shake));
 let g=X.createLinearGradient(0,0,0,HZ);g.addColorStop(0,'#02040f');g.addColorStop(1,'#0a2147');X.fillStyle=g;X.fillRect(-20,-20,W+40,H+40);
 for(const s of stars){X.fillStyle='rgba(180,220,255,'+s.a+')';X.fillRect(s.x,s.y,s.r,s.r)}
 g=X.createLinearGradient(0,HZ,0,G);g.addColorStop(0,'#0a2a5c');g.addColorStop(1,'#0b3a80');X.fillStyle=g;X.fillRect(0,HZ,W,G-HZ);
 X.strokeStyle='rgba(60,170,255,.35)';X.lineWidth=1;X.beginPath();
 for(let i=-10;i<=10;i++){X.moveTo(W/2+i*18,HZ);X.lineTo(W/2+i*60,G)}
 for(let k=1;k<=6;k++){const y=HZ+(G-HZ)*Math.pow(k/6,2);X.moveTo(0,y);X.lineTo(W,y)}X.stroke();
 X.fillStyle='#04102a';X.fillRect(0,G,W,H-G);X.fillStyle='#3d6f9f';X.font='9px Orbitron,sans-serif';X.textAlign='right';X.fillText('SURVIVE // DODGE // CHAIN DODGE',W-14,H-14);
 X.strokeStyle='#33c6ff';X.lineWidth=2;X.shadowColor='#2ec8ff';X.shadowBlur=12;X.beginPath();X.moveTo(0,G);X.lineTo(W,G);X.stroke();X.shadowBlur=0;
 X.strokeStyle='rgba(150,200,255,.22)';X.beginPath();for(const r of rain){X.moveTo(r.x,r.y);X.lineTo(r.x-3,r.y+14)}X.stroke();
 for(const b of bolts){if(b.st==0){const q=b.age/b.tw,fl=Math.sin(b.age*40)>0?1:.5;X.fillStyle='rgba(255,210,63,'+(.04+.12*q)*fl+')';X.fillRect(b.x-22,0,44,G);
   X.strokeStyle='rgba(255,210,63,'+(.2+.6*q)+')';X.lineWidth=2;X.beginPath();X.moveTo(b.x,0);X.lineTo(b.x,G);X.stroke();X.beginPath();X.ellipse(b.x,G,10+26*q,4+6*q,0,0,6.28);X.stroke()}
  else{const a=1-b.age/.22,p=jag(b.x+R(-6,6),0,b.x,G,16,16);X.globalAlpha=a;X.shadowColor='#2ec8ff';X.shadowBlur=18;X.strokeStyle='#4fd0ff';X.lineWidth=10;path(p);X.strokeStyle='#fff';X.lineWidth=3;path(p);X.shadowBlur=0;X.globalAlpha=1}}
 for(const w of waves){X.fillStyle='#ffe066';X.shadowColor='#ffd23f';X.shadowBlur=10;X.fillRect(w.x-3,G-16,6,16);X.fillStyle='rgba(255,210,63,.35)';X.fillRect(w.x-3-w.d*18,G-8,6,8);X.shadowBlur=0}
 for(const o of orbs){X.strokeStyle='rgba(150,220,255,.4)';X.lineWidth=2;X.beginPath();X.moveTo(o.x-o.vx*.15,o.y-50);X.lineTo(o.x,o.y);X.stroke();X.shadowColor='#6fd0ff';X.shadowBlur=18;X.fillStyle='#eaf8ff';X.beginPath();X.arc(o.x,o.y,o.r,0,6.28);X.fill();X.shadowBlur=0}
 for(const p of picks){const c=p.k=='s'?'#2ec8ff':'#ffd23f';X.strokeStyle=c;X.lineWidth=2;X.shadowColor=c;X.shadowBlur=10;X.beginPath();X.arc(p.x,p.y,12,0,6.28);X.stroke();X.shadowBlur=0;X.font='13px sans-serif';X.textAlign='center';X.fillText(p.k=='s'?'🛡':'⏳',p.x,p.y+5)}
 if(mode!=='menu'&&(inv<=0||Math.floor(T*14)%2)){const air=P.y<G-1,ph=air?1.2:(Math.abs(P.vx)>25?T*16:0),sw=Math.sin(ph)*6,x=P.x,y=P.y;
  X.strokeStyle='#eaf8ff';X.lineWidth=2.5;X.lineCap='round';X.shadowColor='#2ec8ff';X.shadowBlur=10;X.beginPath();X.arc(x,y-35,5.5,0,6.28);X.moveTo(x,y-29);X.lineTo(x,y-15);
  X.moveTo(x,y-15);X.lineTo(x-sw-(air?5:0),y);X.moveTo(x,y-15);X.lineTo(x+sw+(air?5:0),y);X.moveTo(x,y-26);X.lineTo(x-7+(air?-3:sw*.4),y-air*8-17);X.moveTo(x,y-26);X.lineTo(x+7+(air?3:-sw*.4),y-air*8-17);X.stroke();X.shadowBlur=0;
  if(shield){X.strokeStyle='rgba(46,200,255,.8)';X.lineWidth=2;X.beginPath();X.arc(x,y-20,28,0,6.28);X.stroke()}}
 for(const f of fx){X.globalAlpha=Math.min(1,f.l*2);X.fillStyle=f.c;X.fillRect(f.x,f.y,3,3)}X.globalAlpha=1;
 X.textAlign='center';X.font='800 15px Orbitron,sans-serif';for(const p of pops){X.globalAlpha=Math.min(1,p.l*1.5);X.fillStyle=p.c;X.fillText(p.s,p.x,p.y)}X.globalAlpha=1;
 if(slow>0){X.fillStyle='rgba(255,210,63,.06)';X.fillRect(0,0,W,H)}
 if(flash>0){X.fillStyle='rgba(190,230,255,'+flash*.5+')';X.fillRect(-20,-20,W+40,H+40)}
 X.restore()}
let hc='';function hud(){const s=Math.floor(score),t=Math.floor(T/60)+':'+(T%60<10?'0':'')+(T%60).toFixed(1),h=[level,t,s,'x'+mult(),'♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,5-Math.max(0,lives)))+(shield?' 🛡':'')+(slow>0?' ⏳':'')].join('|');
 if(h===hc)return;hc=h;$('hl').textContent=level;$('ht').textContent=t;$('hs').textContent=s;$('hc').textContent='x'+mult();$('hp').textContent=h.split('|')[4]}
function show(k){const o=$('ov');o.style.display='flex';
 if(k=='menu')o.innerHTML='<h1>THUNDERSTORM<br>SURVIVAL</h1><p>Dodge the lightning. Survive as long as you can.</p><p>◀ ▶ / A D : Move<br>↑ / Space : Jump (double jump)<br>Avoid the yellow warning zones<br>Jump over the ground waves<br>🛡 Shield &nbsp; ⏳ Slow time</p><p>BEST '+Math.floor(best)+'</p><p id="lb" style="font-size:12px"></p><button class="go" id="go">PLAY</button>';
 else if(k=='over')o.innerHTML='<p>GAME OVER</p><div class="big">'+Math.floor(score)+'</div><p>LEVEL '+level+' · BEST '+Math.floor(best)+'</p><p id="lb" style="font-size:12px"></p><button class="go" id="go">RETRY</button>';
 else o.innerHTML='<h1>PAUSED</h1><button class="go" id="go">RESUME</button>';
 if(k!='pause')loadLb();
 $('go').onclick=()=>{ac();if(k=='pause'){togglePause()}else{reset();mode='play';hc='';o.style.display='none'}}}
function togglePause(){if(mode!=='play')return;paused=!paused;if(paused)show('pause');else $('ov').style.display='none'}
function bind(id,on,off){const e=$(id);e.addEventListener('pointerdown',v=>{v.preventDefault();ac();on()});['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,off))}
bind('bl',()=>K.l=1,()=>K.l=0);bind('br',()=>K.r=1,()=>K.r=0);bind('bj',jump,()=>{});
$('bp').onclick=togglePause;$('bm').onclick=()=>{muted=!muted;$('bm').textContent=muted?'🔇':'🔊'};
addEventListener('keydown',e=>{const k=e.key;if(k=='a'||k=='A'||k=='ArrowLeft')K.l=1;else if(k=='d'||k=='D'||k=='ArrowRight')K.r=1;
 else if(k=='w'||k=='W'||k=='ArrowUp'||k==' '){e.preventDefault();if(!e.repeat)jump()}else if(k=='p'||k=='P'||k=='Escape')togglePause()});
addEventListener('keyup',e=>{const k=e.key;if(k=='a'||k=='A'||k=='ArrowLeft')K.l=0;else if(k=='d'||k=='D'||k=='ArrowRight')K.r=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused)togglePause()});
addEventListener('contextmenu',e=>e.preventDefault());
function fit(){const s=$('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H),e=$('wrap');e.style.width=W*k+'px';e.style.height=H*k+'px'}
addEventListener('resize',fit);fit();show('menu');
let last=performance.now();(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(!paused){ambient(dt);if(mode==='play')update(dt)}draw();hud();requestAnimationFrame(loop)})(last);
</script></body></html>

<!DOCTYPE html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Games</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;padding:18px;background:#030617;color:#e6f4ff;font-family:system-ui,"Noto Sans Myanmar",sans-serif}
h1{font-size:24px;color:#2ec8ff;margin:4px 0 14px}h2{font-size:16px;margin:22px 0 6px}
a.g{display:block;background:#07204a;border:1px solid #1d5fa8;border-radius:14px;padding:18px;margin:10px 0;color:inherit;text-decoration:none;font-size:19px}
ol{margin:0;padding-left:22px;color:#9cc4e8;line-height:1.8}</style></head><body>
<h1>🎮 Game Hub</h1><div id="list"></div><div id="boards"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();tg.BackButton.hide()}
(async()=>{try{const gs=await (await fetch('/api/games')).json();const L=document.getElementById('list'),B=document.getElementById('boards');
for(const g of gs){const a=document.createElement('a');a.className='g';a.href='/g/'+g.id;a.textContent=g.emoji+'  '+g.title;L.appendChild(a);
const h=document.createElement('h2');h.textContent='🏆 '+g.title;const o=document.createElement('ol');B.append(h,o);
const r=await (await fetch('/api/leaderboard?game='+g.id)).json();
if(!r.length){const li=document.createElement('li');li.textContent='မရှိသေးပါ';o.appendChild(li)}
r.forEach(x=>{const li=document.createElement('li');li.textContent=x.name+' - '+x.score;o.appendChild(li)})}}catch(e){}})();
</script></body></html>

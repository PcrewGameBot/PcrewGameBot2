<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0e1f;--card:#131a33;--ink:#eef3ff;--dim:#8b97b8;--acc:#7c6cff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Myanmar","Segoe UI",sans-serif;padding:14px 14px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}

.av img{width:100%;height:100%;object-fit:cover}
.top small{display:block;color:var(--dim);font-size:12px}.top b{font-size:18px}
.card{position:relative;display:block;height:150px;border-radius:24px;margin:0 0 14px;overflow:hidden;color:#fff;text-decoration:none;isolation:isolate;box-shadow:0 8px 24px #0006;transition:transform .15s}
.card:active{transform:scale(.97)}
.art{position:absolute;inset:0;z-index:1}
.tag{position:absolute;top:14px;left:14px;background:#fff;color:#e8590c;font-weight:800;font-size:12px;padding:5px 11px;border-radius:12px;z-index:3}

.rain{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 14px,#ffffff26 14px 15px);background-size:60px 60px;animation:rain .8s linear infinite;opacity:.5}
@keyframes rain{to{background-position:-30px 60px}}
.orb{position:absolute;border-radius:50%;background:radial-gradient(#fff 30%,#9fe8ff 60%,transparent 72%);animation:fl 3s ease-in-out infinite}
.o1{width:26px;height:26px;right:130px;top:30px}.o2{width:16px;height:16px;right:30px;top:92px;animation-delay:-1s}.o3{width:20px;height:20px;right:176px;top:98px;animation-delay:-2s}
@keyframes fl{50%{transform:translateY(-12px)}}
.bolt{position:absolute;right:70px;top:10px;height:130px;filter:drop-shadow(0 0 10px #7df);animation:fk 2.6s infinite}
@keyframes fk{0%,100%{opacity:1}6%{opacity:.2}9%{opacity:1}12%{opacity:.3}50%{opacity:.9}}
.em{position:absolute;right:28px;top:20px;font-size:84px;animation:fl 3s ease-in-out infinite}
.soon{border:2px dashed #2a3560;border-radius:24px;padding:26px;text-align:center;color:var(--dim);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0a0e1fdd;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #1c2548}
nav button{flex:1;max-width:170px;background:none;border:0;color:var(--dim);border-radius:18px;padding:9px 0;font:600 12px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}nav button.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chip{flex:none;background:var(--card);color:var(--ink);border:1px solid #243060;border-radius:16px;padding:9px 14px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:8px}
.row.me{outline:2px solid var(--acc)}.rk{width:30px;text-align:center;font-weight:800}
.pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc{font-weight:800;color:#7dd3fc}
.gate{text-align:center;padding:40px 8px}.gate h2{margin:0 0 8px;font-size:24px}.gate p{color:var(--dim);margin:0 0 22px}
.gbtn{display:block;width:100%;padding:15px;margin:0 0 12px;font-size:16px;text-decoration:none;text-align:center;font-family:system-ui,sans-serif}
.play{position:absolute;right:14px;bottom:16px;z-index:3;padding:10px 24px;font-size:15px}
.empty{color:var(--dim);text-align:center;padding:30px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}


.stars{position:absolute;inset:0;background:radial-gradient(#fff 1px,transparent 1.5px) 0 0/34px 34px,radial-gradient(#ffffffaa 1px,transparent 1.5px) 17px 17px/34px 34px;animation:st 2.4s linear infinite;opacity:.55}
@keyframes st{to{background-position:0 34px,17px 51px}}
.planet{position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd1f7,#a855f7 55%,#4c1d95);opacity:.8}
.ship{position:absolute;right:92px;top:46px;font-size:52px;transform:rotate(-45deg);animation:fl 2.6s ease-in-out infinite}
.ufo{position:absolute;right:40px;top:22px;font-size:34px;animation:fl 2s ease-in-out infinite reverse}
.beam{position:absolute;width:3px;height:16px;border-radius:2px;background:#7fe0ff;box-shadow:0 0 8px #7fe0ff;animation:bm 1s linear infinite}
.b1{right:70px;top:80px}.b2{right:120px;top:100px;animation-delay:-.5s}
@keyframes bm{from{transform:translateY(40px);opacity:1}to{transform:translateY(-50px);opacity:0}}

.bt{position:absolute;bottom:62px;width:30px;height:78px;border:3px solid #ffffff99;border-top:0;border-radius:4px 4px 15px 15px;display:flex;flex-direction:column-reverse;overflow:hidden;background:#ffffff22;animation:fl 3s ease-in-out infinite}
.bt i{flex:1}.t1{right:22px}.t2{right:66px;animation-delay:-1s}.t3{right:110px;animation-delay:-2s}

.tr{position:absolute;animation:sw 4s ease-in-out infinite;transform-origin:bottom}
.tr1{right:70px;top:-6px;font-size:92px}.tr2{right:16px;top:34px;font-size:60px;animation-delay:-1.5s}
@keyframes sw{50%{transform:rotate(3deg)}}
.ax{position:absolute;right:112px;top:56px;font-size:46px;transform-origin:80% 80%;animation:ch .7s ease-in-out infinite}
@keyframes ch{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(15deg)}}
.wc{position:absolute;width:7px;height:7px;background:#d9a066;border-radius:1px;animation:wcf 1.4s ease-out infinite}
.w1{right:104px;top:82px}.w2{right:92px;top:90px;animation-delay:-.5s;background:#b87a3d}.w3{right:112px;top:96px;animation-delay:-.9s}
@keyframes wcf{from{transform:translate(0,0);opacity:1}to{transform:translate(-34px,-26px) rotate(160deg);opacity:0}}

.rblob{position:absolute;right:30px;top:-30px;width:112px;height:112px;border-radius:50%;background:radial-gradient(#ffb3b3 1.3px,transparent 1.8px) 0 0/9px 9px,radial-gradient(circle,#ef4444 55%,#991b1b 100%);animation:fl 3.4s ease-in-out infinite}
.gt{position:absolute;right:96px;top:78px;background:linear-gradient(180deg,#fde047,#d89a00);color:#fff;font-weight:900;font-size:19px;padding:1px 14px;border-radius:6px;border:2px solid #8a5a00;text-shadow:0 2px 0 #8a5a00;animation:fl 3s ease-in-out infinite}
.sd{position:absolute;width:6px;height:6px;border-radius:50%;background:#3b82f6;box-shadow:0 0 6px #60a5fa;animation:up 1.1s linear infinite}
.s1{right:150px;top:112px}.s2{right:134px;top:112px;animation-delay:-.4s}.s3{right:166px;top:112px;animation-delay:-.8s}
@keyframes up{from{transform:translateY(20px);opacity:1}to{transform:translateY(-70px);opacity:0}}

.road{position:absolute;right:0;top:0;bottom:0;width:160px;background:linear-gradient(180deg,#fff 50%,transparent 50%) center top/5px 34px repeat-y,linear-gradient(90deg,#222733,#3a4154);animation:rdm .5s linear infinite;opacity:.9}
@keyframes rdm{to{background-position:center 34px,0 0}}
.cr{position:absolute;font-size:46px;transform:rotate(90deg);animation:fl 2s ease-in-out infinite}
.c1{right:100px;top:14px}.c2{right:38px;top:56px;animation-delay:-1s}
.gl{position:absolute;right:26px;top:8px;font-size:86px;animation:fl 3.4s ease-in-out infinite}
.bl{position:absolute;right:92px;top:92px;font-size:30px;animation:bk 1.4s ease-in infinite}
@keyframes bk{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(18px,-62px) scale(.5);opacity:.2}}
.kp{position:absolute;right:62px;top:46px;font-size:34px;animation:fl 1.6s ease-in-out infinite}

.dv{position:absolute;right:30px;top:6px;font-size:76px;animation:fl 2.6s ease-in-out infinite}
.sp1,.sp2{position:absolute;bottom:62px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:22px solid #e6e9f2;animation:spk 2.2s ease-in-out infinite}
.sp1{right:160px}.sp2{right:132px;animation-delay:-1.1s}
@keyframes spk{0%,60%,100%{transform:translateY(24px);opacity:0}70%,90%{transform:translateY(0);opacity:1}}
.st1{position:absolute;right:112px;top:84px;font-size:36px}

.bb{position:absolute;width:30px;height:30px;border-radius:7px;box-shadow:inset 0 -4px 0 #0004,inset 0 4px 0 #fff4;animation:fl 3s ease-in-out infinite}
.b1{right:120px;top:22px;background:#ef4444}.b2{right:86px;top:22px;background:#f59e0b;animation-delay:-.6s}.b3{right:86px;top:56px;background:#22c55e;animation-delay:-1.2s}.b4{right:52px;top:56px;background:#3b82f6;animation-delay:-1.8s}
.fr{position:absolute;font-size:52px;animation:fl 2.4s ease-in-out infinite}.f1{right:90px;top:14px}.f2{right:30px;top:52px;animation-delay:-1.2s}
.sl{position:absolute;right:40px;top:30px;width:120px;height:4px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(-30deg);border-radius:3px;animation:slc 1.8s ease-in-out infinite}
@keyframes slc{0%,60%,100%{opacity:0}70%,85%{opacity:1}}
.sk{position:absolute;height:22px;border-radius:5px;box-shadow:inset 0 -4px 0 #0003,inset 0 3px 0 #fff4;animation:fl 3s ease-in-out infinite}
.k1{right:50px;bottom:66px;width:96px;background:#f59e0b}.k2{right:56px;bottom:90px;width:84px;background:#22c55e;animation-delay:-.5s}.k3{right:62px;bottom:114px;width:70px;background:#3b82f6;animation-delay:-1s}.k4{right:68px;bottom:138px;width:56px;background:#a855f7;animation-delay:-1.5s}
.hp{position:absolute;right:112px;top:84px;font-size:34px;animation:hpa 1.6s ease-in infinite}
@keyframes hpa{0%{transform:translate(0,0)}60%{transform:translate(18px,-58px)}100%{transform:translate(26px,-30px) scale(.8)}}
.hr{position:absolute;right:50px;top:30px;width:70px;height:8px;border-radius:4px;background:#ff5a2a;box-shadow:0 0 8px #ff5a2a}
.tl{position:absolute;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;box-shadow:inset 0 3px 0 #fff4;animation:fl 3s ease-in-out infinite}
.t1{right:100px;top:18px;background:#eee4da;color:#776e65}.t2{right:50px;top:18px;background:#f2b179;animation-delay:-.7s}.t3{right:100px;top:68px;background:#f67c5f;animation-delay:-1.4s}.t4{right:50px;top:68px;background:#edcf72;animation-delay:-2s}
.chips2{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 2px;padding:2px 16px 6px;scrollbar-width:none}.chips2::-webkit-scrollbar{display:none}
.ch2{flex:none;border:1px solid #ffffff2a;background:#ffffff14;color:#e9e6ff;border-radius:999px;padding:9px 16px;font:700 14px system-ui,sans-serif;white-space:nowrap}
.ch2.on{background:linear-gradient(180deg,#9d8bff,#5a3fd8);border-color:#d3c8ff;color:#fff;box-shadow:0 4px 12px #5a3fd899}
.ico span{display:block;width:62px;height:62px;font-size:0}.ico svg{width:100%;height:100%;display:block}
.bigico{position:absolute;right:22px;top:8px;width:118px;height:118px;animation:fl 3s ease-in-out infinite}.bigico svg{width:100%;height:100%;display:block}
.hi{display:inline-block;width:34px;height:34px;vertical-align:-6px;margin-right:8px}.hi svg{width:100%;height:100%;display:block}
.ci{display:inline-block;width:22px;height:22px;vertical-align:-6px;margin-right:6px}.ci svg{width:100%;height:100%;display:block}
.mi{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin-right:6px}.mi svg{width:100%;height:100%;display:block}
.lk{width:42px!important}.lk svg{width:40px;height:40px;display:block;margin:0 auto}
#nv button i{display:block;line-height:0}#nv button svg{width:50px;height:50px}
/* Glossy gradient pill buttons */
.pill,.gbtn,.chip.on,nav button.on,.go,.cb,.ib{isolation:isolate;border:2px solid #8f9bff;border-radius:999px;color:#fff;font-weight:900;letter-spacing:.5px;background:linear-gradient(180deg,#5b78ff 0%,#2c35e6 52%,#1b20b9 100%);box-shadow:0 0 0 1px #0a0f5a,0 4px 14px #2c35e688,inset 0 -3px 7px #0a0e7a99}
.gbtn,.chip,nav button,.go,.cb,.ib{position:relative}
.pill::before,.gbtn::before,.chip.on::before,nav button.on::before,.go::before,.cb::before,.ib::before{content:"";position:absolute;z-index:-1;left:9%;right:9%;top:3px;height:44%;border-radius:999px;background:linear-gradient(180deg,#ffffffb3,#ffffff14);pointer-events:none}
.pill:active,.gbtn:active,.chip.on:active,nav button.on:active,.go:active,.cb:active,.ib:active{transform:translateY(1px) scale(.97);filter:brightness(.92)}

/* Gamee-style layout */
body{background:linear-gradient(180deg,#4b1d8f 0,#2a1275 22%,#120d52 55%,#07072e 100%) fixed;padding:16px 16px calc(112px + env(safe-area-inset-bottom))}
.prof{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.prof .av{width:52px;height:52px;border:3px solid #8f7bff;box-shadow:0 0 0 2px #3a2a8a}
.pn2{flex:1;min-width:0}.pn2 b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pn2 small{color:#b8b3e8;font-size:13px}
.sp{display:flex;align-items:center;gap:6px;background:#0f0c33cc;border:1px solid #ffffff22;border-radius:999px;padding:7px 13px;font-weight:800;font-size:15px;white-space:nowrap}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 6px}.hd h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.3px;text-transform:uppercase}.hd span{color:#c4bdf5;font-size:15px}
.sb{color:#cfc9f7;font-size:15px;margin:0 0 12px;line-height:1.4}
.gr{display:flex;align-items:center;gap:14px;padding:10px 2px;color:inherit;text-decoration:none}
.ico{width:72px;height:72px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:38px;box-shadow:inset 0 0 0 2px #ffffff30,0 6px 14px #0006;overflow:hidden;position:relative}
.ico span{position:relative;z-index:1;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 3px 4px #0006)}
.ico::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff4d,#ffffff00 48%)}
.rm{flex:1;min-width:0}.rt{font-size:20px;font-weight:800;line-height:1.15}.rd{color:#c4bdf5;font-size:14px;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rp{position:relative;padding:12px 22px;font-size:17px;flex:none}
.mc{background:#ffffff14;border:1px solid #ffffff22;border-radius:26px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mc .av{width:46px;height:46px}
.lr{display:flex;align-items:center;gap:12px;background:#ffffff12;border:1px solid #ffffff1c;border-radius:20px;padding:12px 14px;margin-bottom:10px}
.lr.me{outline:2px solid #8f7bff;background:#8f7bff2a}
.lk{width:34px;text-align:center;font-weight:900;font-size:20px}
.la{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c6cff,#2ec8ff);display:grid;place-items:center;font-weight:900;flex:none}
.ln{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lx{font-weight:900;color:#ffd84d;white-space:nowrap}
#nv{z-index:50;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));border:1px solid #ffffff1f;border-radius:34px;background:rgba(18,16,34,.92);padding:10px 14px 12px;gap:6px;justify-content:space-around;box-shadow:0 10px 30px #000a}
#nv button,#nv button.on{flex:1;max-width:none;background:none;border:0;box-shadow:none;border-radius:20px;color:#b9b4d8;font:700 13px system-ui,sans-serif;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
#nv button i{display:block;line-height:0;filter:drop-shadow(0 4px 5px #0009) saturate(.7) brightness(.85);transition:transform .15s,filter .15s}#nv button svg{width:44px;height:44px}
#nv button.on{color:#fff;font-weight:900}#nv button.on i{transform:translateY(-3px) scale(1.12);filter:drop-shadow(0 5px 6px #000a) saturate(1.1) brightness(1.05)}
#nv button.on::before{display:none}
#nv button.on::after{content:"";width:16px;height:4px;border-radius:3px;background:#ffd84d;position:absolute;bottom:-3px}

/* ===== Candy clay theme ===== */
:root{--ink:#4a2370;--soft:#8d63b8;--pink:#ff4fa8;--shade:#e4cfff}
html,body{font-family:'Fredoka','Baloo 2','Nunito',system-ui,-apple-system,sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#ffc6ea 0%,#e2c4ff 42%,#b4e0ff 100%) fixed;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.85;animation:drift 14s ease-in-out infinite alternate;
 background:radial-gradient(circle at 12% 18%,#ffe36a 0 7px,transparent 8px),radial-gradient(circle at 86% 12%,#7be0ff 0 6px,transparent 7px),radial-gradient(circle at 70% 34%,#ff8ad0 0 5px,transparent 6px),radial-gradient(circle at 8% 52%,#8cf0b8 0 6px,transparent 7px),radial-gradient(circle at 92% 58%,#ffe36a 0 5px,transparent 6px),radial-gradient(circle at 30% 76%,#b69cff 0 6px,transparent 7px),radial-gradient(circle at 80% 86%,#ff8ad0 0 7px,transparent 8px),radial-gradient(circle at 18% 94%,#7be0ff 0 5px,transparent 6px)}
@keyframes drift{to{transform:translateY(14px)}}
#v{position:relative;z-index:1}
.prof{background:#fff;border-radius:30px;padding:10px 14px;margin:2px 0 16px;box-shadow:inset 0 3px 0 #fff,0 6px 0 var(--shade),0 14px 24px rgba(110,60,180,.22)}
.prof .av{border:3px solid #fff;background:linear-gradient(135deg,#ff7ac6,#8f7bff);box-shadow:0 0 0 3px #ff9bd5,0 4px 8px rgba(110,60,180,.3)}
.pn2 b{color:var(--ink);font-weight:700}.pn2 small{color:var(--soft)}
.sp{background:linear-gradient(180deg,#fff2a0,#ffc93a);color:#7a4a00;border:2px solid #fff;box-shadow:0 4px 0 #e39a12,0 8px 14px rgba(227,154,18,.35);font-weight:700}
.sp .mi{filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.hd{margin:22px 0 8px}
.hd h1{color:#5b2c93;font-weight:700;font-size:27px;text-shadow:0 2px 0 #fff,0 4px 8px rgba(110,60,180,.25);letter-spacing:.2px}
.hd span{color:var(--soft);font-weight:600}
.hi svg,.ci svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.sb{color:var(--soft)}
.card{border:4px solid rgba(255,255,255,.85);border-radius:34px;box-shadow:inset 0 6px 14px rgba(255,255,255,.45),0 8px 0 rgba(90,40,150,.28),0 18px 26px rgba(90,40,150,.25)}
.card .cn{font-weight:700;font-size:23px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.card .cn small{font-weight:600}
.tag{background:#fff;color:#ff3d93;font-weight:700;box-shadow:0 3px 0 #ffc2e0}
.chips2{margin:14px -16px 4px}
.ch2{background:#fff;color:#7a4ca6;border:3px solid #fff;font:600 15px 'Fredoka',system-ui,sans-serif;box-shadow:0 4px 0 var(--shade),0 8px 12px rgba(110,60,180,.15);padding:8px 16px}
.ch2.on{background:linear-gradient(180deg,#ff9bd5,#ff4fa8);color:#fff;text-shadow:0 2px 0 rgba(160,20,100,.45);box-shadow:0 4px 0 #c4156f,0 8px 14px rgba(196,21,111,.3)}
.gr{background:#fff;border-radius:30px;padding:10px 12px;margin:0 0 14px;box-shadow:inset 0 3px 0 #fff,0 6px 0 var(--shade),0 14px 24px rgba(110,60,180,.2);transition:transform .12s}
.gr:active{transform:translateY(3px);box-shadow:inset 0 3px 0 #fff,0 3px 0 var(--shade),0 8px 14px rgba(110,60,180,.2)}
.ico{border-radius:24px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 5px 0 rgba(90,40,150,.3),0 10px 14px rgba(90,40,150,.2)}

const FB=['linear-gradient(135deg,#d97706,#fbbf24)','linear-gradient(135deg,#6d28d9,#a855f7)','linear-gradient(135deg,#047857,#34d399)','linear-gradient(135deg,#be123c,#fb7185)'];
let games=[],ME={};
function mkAv(){const a=h('div','av');const ini=()=>{a.textContent=nm[0].toUpperCase()};if(U.photo_url){const i=new Image();i.src=U.photo_url;i.onerror=()=>{i.remove();ini()};a.appendChild(i)}else ini();return a}
function hdi(ic,t,r){const d=h('div','hd');const s=h('h1','');s.innerHTML='<span class="hi">'+icon(ic)+'</span>';s.append(document.createTextNode(t));d.append(s);if(r)d.append(h('span','',r));return d}
function hd(t,r){const d=h('div','hd');d.append(h('h1','',t));if(r)d.append(h('span','',r));return d}
function prof(){const p=h('div','prof');p.append(mkAv());const m=h('div','pn2');m.append(h('b','',nm));if(U.username)m.append(h('small','','@'+U.username));p.append(m);if(ME.xp!=null){const d=h('div','sp');d.innerHTML='<span class="mi">'+icon('star')+'</span>';d.append(document.createTextNode(ME.xp+' XP'));p.append(d)}return p}
function gr(g,i){const t=TH[g.id]||{},a=h('a','gr');a.href='/g/'+g.id;const ico=h('div','ico');ico.style.background=t.bg||FB[i%FB.length];ico.innerHTML='<span>'+icon(g.id)+'</span>';a.append(ico);
 const m=h('div','rm');m.append(h('div','rt',g.title),h('div','rd',(pl(g)>0?fmt(pl(g))+' plays · ':'')+(t.desc||t.sub||'')));a.append(m,h('div','pill rp','PLAY'));return a}
const CATS={action:{t:'Action',e:'🔥'},sport:{t:'Racing & Sports',e:'🏁'},puzzle:{t:'Puzzle',e:'🧠'},tap:{t:'Tap & Skill',e:'👆'}};
let flt='all';
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(n);
const pl=g=>g.plays||0;
function home(){const v=$('v');v.innerHTML='';v.append(prof());
 if(games.length){const top=games.slice().sort((a,b)=>pl(b)-pl(a)||games.indexOf(b)-games.indexOf(a))[0],t=TH[top.id]||{};
  v.append(hd(pl(top)>0?'Most played':'Featured'));const a=h('a','card');a.href='/g/'+top.id;a.style.background=t.bg||FB[0];
  const art=h('div','art');art.innerHTML='<div class="bigico">'+icon(top.id)+'</div>';a.append(art,h('div','play pill','PLAY'));
  a.append(h('div','tag',pl(top)>0?fmt(pl(top))+' plays':(t.tag||'NEW')));
  const cn=h('div','cn',top.title);if(t.sub)cn.append(h('small','',t.sub));a.append(cn);v.append(a)}
 const groups=Object.keys(CATS).map(k=>({k,list:games.filter(g=>(g.cat||'tap')===k).sort((a,b)=>pl(b)-pl(a)),tot:0})).filter(x=>x.list.length);
 groups.forEach(x=>x.tot=x.list.reduce((s,g)=>s+pl(g),0));groups.sort((a,b)=>b.tot-a.tot);
 const chips=h('div','chips2');[['all','All']].concat(groups.map(x=>[x.k,CATS[x.k].t])).forEach(c=>{const b=h('button','ch2'+(flt===c[0]?' on':''));if(c[0]!=='all')b.innerHTML='<span class="ci">'+icon('cat-'+c[0])+'</span>';b.append(document.createTextNode(c[1]));b.onclick=()=>{flt=c[0];home()};chips.append(b)});v.append(chips);
 groups.forEach(x=>{if(flt!=='all'&&flt!==x.k)return;v.append(hdi('cat-'+x.k,CATS[x.k].t,x.list.length+(x.list.length>1?' games':' game')));x.list.forEach((g,i)=>v.append(gr(g,i)))});
 v.append(h('div','soon','More games coming soon'))}
function rkb(i){const s=h('span','lk');if(i<3)s.innerHTML=icon('medal'+(i+1));else s.textContent=String(i+1);return s}
async function board(){const v=$('v');v.innerHTML='';v.append(hd('Leaderboard'),h('p','sb','Overall ranking. Open a game to see its top players.'));
 const mc=h('div','mc');mc.append(mkAv());const m=h('div','pn2');m.append(h('b','','Your rank'),h('small','',ME.xp!=null?ME.xp+' XP':'-'));mc.append(m,h('div','sp',ME.rank?'#'+ME.rank:'-'));v.append(mc);
 const box=h('div','');v.append(box);let r=[];try{r=await (await fetch('/api/leaderboard?game=overall')).json()}catch(e){}
 if(!r.length)box.append(h('div','empty','No scores yet. Be the first!'));
 r.forEach((x,i)=>{const row=h('div','lr'+(x.name===nm.slice(0,20)?' me':''));row.append(rkb(i),h('span','la',(x.name||'?')[0].toUpperCase()),h('span','ln',x.name),h('span','lx',x.score+' XP'));box.append(row)})}

 let COURT={};
 async function courtReq(path,data={}){
  const r=await fetch('/api/court/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:'',...data})});
  let j={};try{j=await r.json()}catch(e){};if(!r.ok||j.ok===false)throw new Error(j.error||'Request failed');return j;
 }
 function cbtn(label,fn,cls=''){const b=h('button','court-btn '+cls,label);b.onclick=fn;return b}
 function cinput(ph,max=500){const x=h('textarea','court-input');x.placeholder=ph;x.maxLength=max;x.rows=3;return x}
 async function court(){
  const v=$('v');v.innerHTML='';v.append(prof());const wrap=h('div','court-wrap');v.append(wrap);
  wrap.append(h('div','court-title','⚖️ COUPLE COURT'),h('p','court-sub','A private court for two. LDR is available now. In-Person and Both are coming soon.'));
  let st;try{st=await courtReq('state')}catch(e){wrap.append(h('div','court-card court-deny',e.message));return}
  COURT=st.court||{};
  // Accept Telegram Mini App deep-link invitations automatically.
  const startParam=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';
  if(startParam.startsWith('join_')&&!sessionStorage.getItem('court_join_'+startParam)){
   sessionStorage.setItem('court_join_'+startParam,'1');
   try{await courtReq('join',{code:startParam.slice(5)});alert('💑 Invitation accepted! You are now linked.');COURT=(await courtReq('state')).court||{};}
   catch(e){alert(e.message)}
  }
  if(COURT.removed){wrap.append(h('div','court-card court-deny','🚫 This Couple Court account has been disabled by the owner.'));return}
  if(!COURT.linked){
   const card=h('div','court-card');card.append(h('b','','💑 Create your couple invitation'));
   card.append(h('p','court-sub','Create one private invite link and send it to your partner. Your partner only needs to open the link and accept.'));
   if(COURT.inviteLink){const link=h('input','court-input');link.value=COURT.inviteLink;link.readOnly=true;card.append(link,cbtn('📋 COPY INVITE LINK',async()=>{try{await navigator.clipboard.writeText(COURT.inviteLink);alert('Invite link copied!')}catch(e){prompt('Copy your invite link',COURT.inviteLink)}},'gold'))}
   else card.append(cbtn('➕ CREATE COUPLE INVITE',async()=>{try{const r=await courtReq('create');if(!r.inviteLink)throw new Error(r.error||'Set BOT_USERNAME in Railway Variables.');COURT.inviteLink=r.inviteLink;alert('Invite link created. Copy and send it to your partner.');court()}catch(e){alert(e.message)}},'gold'));
   if(COURT.inviteLink)card.append(cbtn('🚫 CANCEL INVITATION',async()=>{if(!confirm('Cancel this invitation link?'))return;try{await courtReq('cancel');alert('Invitation cancelled.');court()}catch(e){alert(e.message)}},''));
   wrap.append(card);if(COURT.isOwner)await ownerPanel(wrap);return;
  }
  const card=h('div','court-card');card.append(h('b','','💑 COUPLE '+COURT.coupleId),h('p','court-sub','Partner: '+(COURT.partnerName||'Waiting')));
  card.append(h('div','court-label','CHOOSE YOUR RELATIONSHIP TYPE'));
  const choices=[['ldr','🌍 Long Distance (LDR)','available'],['person','👫 In-Person — COMING SOON','soon'],['both','💕 Both — COMING SOON','soon']];
  choices.forEach(([key,label,state])=>{const b=cbtn(label,async()=>{try{await courtReq('type',{type:key});court()}catch(e){alert(e.message)}},COURT.myType===key?'gold':'');if(state==='soon'){b.disabled=true;b.title='Coming Soon';}card.append(b)});
  if(!COURT.typeMatched){card.append(h('p','court-warn',COURT.myType||COURT.partnerType?'⚠️ Both partners must select the same relationship type.':'Both partners must select LDR to continue.'));wrap.append(card);if(COURT.isOwner)await ownerPanel(wrap);return}
  card.append(h('p','court-ok','✅ Relationship type confirmed: LDR'));
  if(!COURT.ready){card.append(h('p','court-warn','Waiting for your partner to select LDR.'));wrap.append(card);if(COURT.isOwner)await ownerPanel(wrap);return}
  wrap.append(card);
  const form=h('div','court-card');form.append(h('b','','📝 OPEN A NEW CASE'));
  const title=h('input','court-input');title.placeholder='Case title (e.g. Replying late)';title.maxLength=80;
  const complaint=cinput('Write anything you want to complain about (5–1000 characters)...',1000);
  form.append(title,complaint,cbtn('⚖️ FILE CASE',async()=>{try{const r=await courtReq('open',{title:title.value,complaint:complaint.value});alert('Case filed: '+r.caseId+'\nYour partner has been notified.');court()}catch(e){alert(e.message)}},'gold'));wrap.append(form);
  const cases=COURT.cases||[];const hist=h('div','court-card');hist.append(h('b','','📜 CASE HISTORY'));
  if(!cases.length)hist.append(h('p','court-sub','No cases yet.'));
  cases.forEach(c=>{const item=h('div','court-case');item.append(h('span','court-badge',c.status==='completed'?'COMPLETED':'WAITING FOR RESPONSE'),h('p','court-sub',c.id+' · '+c.category),h('p','',c.complaint));if(c.response)item.append(h('p','court-sub','Response: '+c.response));if(c.status==='awaiting_response'&&c.defendant===COURT.myId){const reply=cinput('Write your response (2–1000 characters)...',1000);item.append(reply,cbtn('🗣️ SUBMIT RESPONSE',async()=>{try{const r=await courtReq('respond',{caseId:c.id,response:reply.value});await showCourtResult(r);court()}catch(e){alert(e.message)}},'gold'))}else if(c.status==='awaiting_response')item.append(h('p','court-warn','Waiting for your partner to respond.'));if(c.verdict)item.append(h('b','', 'Verdict: '+c.verdict));if(c.punishment)item.append(h('p','court-warn','🎡 Punishment: '+c.punishment));hist.append(item)});wrap.append(hist);
  if(COURT.isOwner) await ownerPanel(wrap);
 }

 async function showCourtResult(r){
  const overlay=h('div','wheel-overlay'),panel=h('div','wheel-panel');
  panel.append(h('div','court-title','⚖️ JUDGE VERDICT'));
  if(r.verdict==='GUILTY'){
   panel.append(h('p','court-warn','GUILTY! Punishment wheel is spinning...'));
   const disc=h('div','wheel-disc','⚖️');panel.append(disc);overlay.append(panel);document.body.append(overlay);requestAnimationFrame(()=>disc.classList.add('spin'));
   await new Promise(resolve=>setTimeout(resolve,3300));
   panel.append(h('h2','','🎡 PUNISHMENT'),h('p','',r.punishment||'Punishment selected'));
   panel.append(cbtn('DONE',()=>overlay.remove(),'gold'));
  }else{
   panel.append(h('h2','','🔴 NOT GUILTY'),h('p','court-sub','The case is closed. No punishment this time.'));
   panel.append(cbtn('DONE',()=>overlay.remove(),'gold'));overlay.append(panel);document.body.append(overlay);
  }
 }
 async function ownerPanel(parent){
  const box=h('div','court-card');box.append(h('b','','👑 OWNER COUPLE MANAGEMENT'),h('p','court-sub','View all couples, remove access, or restore access.'));
  try{const r=await courtReq('owner/list');if(!r.couples.length)box.append(h('p','court-sub','No couples yet.'));r.couples.forEach(c=>{const row=h('div','court-case');row.append(h('b','',c.id+' · '+(c.name1||'')+' + '+(c.name2||'Waiting')),h('p','court-sub','Type: '+(c.type1||'-')+' / '+(c.type2||'-')+' · '+(c.removed?'REMOVED':'ACTIVE')));row.append(cbtn(c.removed?'♻️ RESTORE COUPLE':'🚫 REMOVE COUPLE',async()=>{if(!confirm((c.removed?'Restore ':'Remove ')+c.id+'?'))return;try{await courtReq('owner/status',{coupleId:c.id,remove:!c.removed});alert('Couple status updated.');court()}catch(e){alert(e.message)}},c.removed?'gold':''));box.append(row)})}catch(e){box.append(h('p','court-warn','Owner panel unavailable. Check OWNER_ID in Railway Variables.'))}
  parent.append(box);
 }

function tab(t){document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));t==='home'?home():t==='lb'?board():court()}
document.querySelectorAll('#nv button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
const nav=$('nv');nav.querySelector('[data-t=home] i').innerHTML=icon('nav-games');nav.querySelector('[data-t=lb] i').innerHTML=icon('nav-board');
function openLink(e,u){e.preventDefault();if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}
function gate(me){nav.style.display='none';const v=$('v');v.innerHTML='';const b=h('div','gate');
 if(!me.ok){b.append(h('h2','','Open from Telegram'),h('p','','Please open this app from the bot inside Telegram.'));v.append(b);return}
 b.append(h('h2','','Join to play'),h('p','','Join our channel and group to unlock the games.'));
 [['Channel',me.channel],['Group',me.group]].forEach(x=>{if(x[1]){const a=h('a','gbtn',x[0]);a.href=x[1];a.onclick=ev=>openLink(ev,x[1]);b.append(a)}});
 const c=h('button','gbtn','I joined');c.onclick=()=>{c.textContent='Checking...';boot()};b.append(c);v.append(b)}
async function boot(){let me={ok:false};
 try{me=await (await fetch('/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:''})})).json()}catch(e){}
 if(!me.ok||!me.joined){gate(me);return}
 ME=me;nav.style.display='flex';
 try{games=await (await fetch('/api/games')).json();tab('home')}catch(e){$('v').append(h('div','empty','Connection failed'))}}
boot();
</script></body></html>
